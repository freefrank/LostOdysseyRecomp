description = "New Game: opening movie, then the first battle (Wohl Highlands) with one attack"
timeout = 300
# Seconds since launch. START opens the title menu, A picks New Game, which opens
# the settings screen: B answers the first-run TAA collection prompt, B closes it.
# With a save on the console the menu opens on Continue, and UP (u, which wraps)
# moves to New Game: on a console without a save, drop u@17.
timeline = "s@10,u@17,a@20,b@26,b@32"

[[step]]
# The opening movie is playing (about 120 draws per frame until the battle).
wait_seconds = 100
screenshot = true
hold_seconds = 1

[[step]]
# The battle command menu waits for input (1,100-1,700 draws per frame).
wait_draws = 1000
screenshot = true
hold_seconds = 3

[[step]]
press = "a"          # Attack
hold_seconds = 2

[[step]]
press = "a"          # confirm the target; the attack animation plays
hold_seconds = 15
screenshot = true

[checks]
min_draws = 1000
min_fps = 25

[switch]
# Measured on a Switch OLED in handheld mode (2026-10-29): the title screen is up by 31 s; the settings screen
# needs one B (no first-run prompt); START pauses the opening movie and BACK skips it. The run measures the
# first battle's command menu, which waits for input (about 1,200 draws per frame).
# With a save on the console the title menu opens on Continue; UP (wraps) at 50 s moves to New Game.
buttons = "s@40s,u@50s,a@55s,b@70s,s@110s,k@114s"
start_draws = 1000
settle = 90
frames = 450
timeout = 600
