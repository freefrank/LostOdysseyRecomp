<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LORecomp · TAA 实时调试</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;background:#15191c;color:#e8eeee}body{max-width:1240px;margin:28px auto;padding:0 22px}h1{font-size:24px;margin-bottom:4px}p{color:#9eafb6}section{background:#20272b;padding:18px;border-radius:8px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}label{display:flex;justify-content:space-between;align-items:center;gap:8px}input,select,button{font:inherit;background:#131a1e;color:#e8eeee;border:1px solid #506068;border-radius:4px;padding:7px}input[type=number]{width:95px}button{cursor:pointer}button:hover{border-color:#96d7ba}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.primary{background:#225b45;border-color:#61aa85}pre{white-space:pre-wrap;font-size:12px;max-height:220px;overflow:auto}#preview[hidden]{display:none}#preview{max-width:100%;image-rendering:auto;display:block;margin-top:12px}#message{color:#eeb57f;min-height:22px}a{color:#9bd1bd}.muted{font-size:12px;color:#9eafb6}#files{max-height:140px;overflow:auto}#targets label{justify-content:flex-start}#pixel{font-family:monospace}
</style>
<h1>LORecomp · TAA 实时调试</h1><p>游戏运行时调参；以“已应用”序号确认生效。截图与 GPU trace 会在后续帧异步完成。</p>
<section><strong id="status">连接中…</strong><div class="actions"><button id="launch" disabled>启动游戏 / 重新进入最新存档</button></div><p class="muted">请先正常关闭游戏；重新启动会复用最初的启动模式。原生 Continue 模式读取最新存档。</p><pre id="state"></pre></section>
<section><div class="grid" id="controls"></div><div class="actions"><button class="primary" id="apply">应用参数</button><button id="reset">恢复默认并应用</button><button data-mode="0">正常画面</button><button data-mode="1">接受区域</button><button data-mode="2">拒绝原因</button></div><div id="message" role="status"></div><div id="syncnote" class="muted" role="status"></div></section>
<section><strong>画面与 GPU 数据</strong><div class="actions"><button id="shot1">截图 1 帧</button><button id="shot32">截图 32 帧</button><label>Trace 帧数 <input id="traceframes" type="number" min="1" max="8" value="1"></label><button id="trace">采集 Trace</button></div><div class="actions" id="targets"></div><p class="muted">Trace 最多选择四个目标。二进制文件可下载；已知目标的像素值、帧号和尺寸可通过 /api/pixel?file=文件名&amp;x=0&amp;y=0 读取。</p><div class="actions"><select id="shots" aria-label="截图文件"></select><button id="full">完整画面</button><button id="upper">Bell 横梁 ROI</button><button id="uhra">Uhra 钢架 ROI</button><button id="video">视频标记 ROI</button></div><div class="actions"><label>X <input id="rx" type="number" min="0" value="1062"></label><label>Y <input id="ry" type="number" min="0" value="255"></label><label>宽 <input id="rw" type="number" min="1" value="1326"></label><label>高 <input id="rh" type="number" min="1" value="188"></label><button id="crop">裁剪</button></div><p class="muted">预置 ROI 使用 3840×2160 原图像素坐标。不同分辨率请调整坐标；点击预览读取 RGB。</p><div id="pixel"></div><p id="emptyshot" class="muted">尚未抓帧</p><img id="preview" alt="采集后的截图预览" hidden><div id="files"></div></section>
<script>
const defaults={aa:3,jitter:1,history:1,bloom:-1,hdr:0,materials:1,stationary:1,coverage:1,jitter_scale:1,gpu_timing:0,history_weight:.85,stationary_weight:31/33,motion_min:.002,motion_max:.125,depth_absolute:.00001,depth_relative:.01,acceptance:0,mv_debug:0,mv_consume:1,snap_stationary:0,stationary_color_clip:0,history_fp16:0,stationary_multi_surface:0,moving_bilinear_fallback:0};
const labels={aa:'抗锯齿 AA',jitter:'采样抖动',history:'历史累积',bloom:'Bloom',hdr:'HDR',materials:'材质诊断',stationary:'静止处理',coverage:'轮廓覆盖',jitter_scale:'采样抖动幅度',gpu_timing:'GPU 分段计时',history_weight:'历史权重',stationary_weight:'静止权重',motion_min:'运动下限',motion_max:'运动上限',depth_absolute:'绝对深度阈值',depth_relative:'相对深度阈值',acceptance:'诊断着色',mv_debug:'运动矢量显示',mv_consume:'使用运动矢量',snap_stationary:'实验：静止 MV 归零',stationary_color_clip:'实验：静止颜色裁剪保留历史',history_fp16:'实验：FP16 历史缓存（保持 SDR）',stationary_multi_surface:'实验：静止多层轮廓覆盖',moving_bilinear_fallback:'实验：运动轮廓缩小历史采样'};
const options={aa:[[-1,'沿用设置'],[0,'0'],[1,'1'],[2,'2'],[3,'3 · TAA']],jitter:[[-1,'沿用设置'],[0,'关闭'],[1,'开启']],bloom:[[-1,'沿用设置'],[0,'关闭'],[1,'开启']],acceptance:[[0,'正常'],[1,'接受'],[2,'拒绝原因']]};
const $=id=>document.getElementById(id);let initialized=false,roi=null,lastFiles='',activeShot='',newestShot='',lastRequested={},lastRequestedSerial=0;const dirty=new Map();let editVersion=0;
for(const [key,value] of Object.entries(defaults)){const label=document.createElement('label');label.textContent=labels[key];let input;if(key!=='jitter_scale'&&(options[key]||Number.isInteger(value))){input=document.createElement('select');for(const [v,text] of options[key]||[[0,'关闭'],[1,'开启']]){input.add(new Option(text,v));}}else{input=document.createElement('input');input.type='number';input.step='any';input.min=0;input.max=key==='stationary_weight'?.995:key==='history_weight'?.95:key.startsWith('motion')?16:1;}input.id='c_'+key;input.value=key==='stationary_weight'?Number(value.toFixed(6)):value;input.dataset.raw=value;input.dataset.display=input.value;input.addEventListener('input',()=>dirty.set(key,++editVersion));input.addEventListener('change',()=>dirty.set(key,++editVersion));label.append(input);$('controls').append(label);}
for(const key of ['source','output','depth','mv','motion_depths','reactive']){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=key;input.checked=['source','output'].includes(key);label.append(input,document.createTextNode(key));$('targets').append(label);}
async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||response.statusText);return result;}
function values(){return Object.fromEntries([...dirty.keys()].map(k=>{const input=$('c_'+k);return [k,Number(input.value===input.dataset.display?input.dataset.raw:input.value)];}));}
function fill(v){for(const [k,x] of Object.entries(v)){const input=$('c_'+k);if(input){input.value=k==='stationary_weight'?Number(x.toFixed(6)):x;input.dataset.raw=x;input.dataset.display=input.value;}}}
function syncControls(data){
    if(data.requested_serial<lastRequestedSerial)return;
    const changed=initialized&&Object.entries(data.requested).some(([k,v])=>lastRequested[k]!==v);
    for(const [k,v] of Object.entries(data.requested)){
        const input=$('c_'+k);
        if(input&&!dirty.has(k)&&document.activeElement!==input)fill({[k]:v});
    }
    if(changed)$('syncnote').textContent=dirty.size?'参数已变化；已同步未编辑项，保留你的未提交输入。':'参数已变化，已同步最新请求值。';
    lastRequested={...data.requested};lastRequestedSerial=data.requested_serial;initialized=true;
}
async function action(path,body){
    const edits=new Map(Object.keys(body).map(k=>[k,dirty.get(k)]));
    try{
        const result=await api(path,body);
        if(path==='/api/controls')for(const [k,version] of edits)if(dirty.get(k)===version)dirty.delete(k);
        $('message').textContent='已请求：'+result.serial;await refresh();
    }catch(e){$('message').textContent=e.message;}
}
$('launch').onclick=async()=>{try{const r=await api('/api/launch',{});$('message').textContent='游戏已启动：PID '+r.game.pid;await refresh();}catch(e){$('message').textContent=e.message;}};
$('apply').onclick=()=>{const patch=values();if(Object.keys(patch).length)action('/api/controls',patch);else $('message').textContent='没有待提交的修改。';};$('reset').onclick=()=>{fill(defaults);for(const k of Object.keys(defaults))dirty.set(k,++editVersion);action('/api/controls',defaults);};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const acceptance=Number(b.dataset.mode);$('c_acceptance').value=acceptance;dirty.set('acceptance',++editVersion);action('/api/controls',{acceptance});});
$('shot1').onclick=()=>action('/api/screenshot',{frames:1});$('shot32').onclick=()=>action('/api/screenshot',{frames:32});$('trace').onclick=()=>action('/api/trace',{frames:Number($('traceframes').value),targets:[...$('targets').querySelectorAll(':checked')].map(x=>x.value)});
function preview(){activeShot=$('shots').value;$('preview').hidden=!activeShot;$('emptyshot').hidden=!!activeShot;if(!activeShot)return;const query=new URLSearchParams({file:activeShot});if(roi)for(const [k,v] of Object.entries(roi))query.set(k,v);$('preview').src='/api/preview?'+query;}
$('preview').onerror=()=>{$('message').textContent='预览未完成或 ROI 越界，请尝试完整画面。';};
$('full').onclick=()=>{roi=null;preview();};$('crop').onclick=()=>{roi={x:Number($('rx').value),y:Number($('ry').value),w:Number($('rw').value),h:Number($('rh').value)};preview();};
function preset(x,y,w,h){for(const [id,v] of Object.entries({rx:x,ry:y,rw:w,rh:h}))$(id).value=v;$('crop').click();}
$('upper').onclick=()=>preset(1062,255,1326,188);$('uhra').onclick=()=>preset(220,70,2700,300);$('video').onclick=()=>preset(1166,299,98,90);$('shots').onchange=preview;
$('preview').onclick=async event=>{const img=$('preview'),rect=img.getBoundingClientRect(),x=Math.floor((event.clientX-rect.left)*img.naturalWidth/rect.width)+(roi?.x||0),y=Math.floor((event.clientY-rect.top)*img.naturalHeight/rect.height)+(roi?.y||0);try{const p=await api('/api/pixel?'+new URLSearchParams({file:activeShot,x,y}));$('pixel').textContent=`(${x}, ${y}) RGB = ${p.rgb.join(', ')}`;}catch(e){$('message').textContent=e.message;}};
async function refresh(){try{const data=await api('/api/state');$('launch').disabled=!data.can_relaunch;syncControls(data);const applied=data.state?.applied_serial??'尚无';$('status').textContent=`请求 ${data.requested_serial} · 已应用 ${applied} · ${data.game?`游戏 PID ${data.game.pid} / ${data.game.status}`:'未由本面板启动游戏'}`;$('state').textContent=JSON.stringify(data.state??{提示:'等待游戏输出 state.json'},null,2);const files=await api('/api/files'),signature=JSON.stringify(files);if(signature!==lastFiles){lastFiles=signature;const old=$('shots').value;$('shots').replaceChildren();for(const f of files.filter(x=>x.name.endsWith('.ppm')))$('shots').add(new Option(f.name,f.name));if([...$('shots').options].some(x=>x.value===old))$('shots').value=old;const newest=files.find(x=>x.name.endsWith('.ppm'))?.name||'';if(newest&&newest!==newestShot){newestShot=newest;document.getElementById("shots").value=newest;preview();}$('files').replaceChildren();for(const f of files){const row=document.createElement('div'),link=document.createElement('a');link.href='/api/download?'+new URLSearchParams({file:f.name});link.download=f.name;link.textContent=f.name+' · '+f.size+' bytes';row.append(link);$('files').append(row);}}}catch(e){$('status').textContent='连接失败：'+e.message;}}
refresh();setInterval(refresh,1500);
</script></html>
