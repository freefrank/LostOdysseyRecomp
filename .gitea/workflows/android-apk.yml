name: Android APK

# Packaging check for the arm64 development APK: tools/android/ci_build.sh
# (Android SDK packages, Android DXC, NDK build, Gradle assemble + lint, JVM
# tests) after the same host code generation as the Linux release job. The
# release workflow runs the same script for version tags. Runs on git.zkx.ca
# only; the privileged runner's LO_CI_CACHE volume keeps the SDK/NDK, the DXC
# build, the Gradle home and ccache between runs, so the first run (which
# compiles DXC) is the slow one. A green run is a packaging check, not device
# acceptance.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - .gitea/workflows/android-apk.yml
      - packaging/android/**
      - thirdparty/libadrenotools/**
      - thirdparty/signalsmith*/**
      - LostOdysseyRecomp/apu/**
      - tools/android/**
permissions:
  contents: read
jobs:
  apk:
    name: Android arm64 APK
    runs-on: ubuntu-22.04-privileged
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host toolchain for the recompiler tools
        run: bash tools/release/install_appimage_toolchain.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build file unzip wget ccache openjdk-17-jdk-headless
          # Jammy's distribution CMake predates the project's 3.28 minimum.
          python -m pip install 'cmake==3.31.6'
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          token: ${{ secrets.LO_GITHUB_TOKEN }}
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 2ba529b72c68ae2ee01903d24f7eac55cbb900df
          path: out/build-input
          sparse-checkout: |
            /default.xex
            /android/libdxcompiler.so
            /android/debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build the APK
        run: bash tools/android/ci_build.sh
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        with:
          name: LostOdysseyRecomp-android-arm64-debug
          path: out/apk/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        if: always()
        with:
          name: android-test-reports
          path: |
            packaging/android/runtime/build/reports/**
            packaging/android/runtime/build/test-results/**
          retention-days: 7
  # Mirror the result onto the GitHub commit so pull requests show it. Needs a
  # Gitea secret LO_GITHUB_TOKEN (fine-grained PAT, Commit statuses: write).
  github-status:
    needs: [apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report to GitHub
        env:
          LO_GITHUB_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
          RESULTS: ${{ needs.apk.result }}
          CONTEXT: gitea/android-apk
          RUN_URL: https://git.zkx.ca/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          if [ -z "$LO_GITHUB_TOKEN" ]; then echo 'LO_GITHUB_TOKEN is not set; skipping'; exit 0; fi
          state=success
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; cancelled) [ "$state" = failure ] || state=error ;; *) state=failure ;; esac
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LO_GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/freefrank/LostOdysseyRecomp/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"$CONTEXT\",\"description\":\"Gitea Actions: $RESULTS\",\"target_url\":\"$RUN_URL\"}") || true
          echo "GitHub status $state for $GITHUB_SHA -> HTTP $code"
