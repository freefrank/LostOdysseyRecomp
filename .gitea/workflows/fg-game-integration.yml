name: FG game integration compile

# Pull request checks run on git.zkx.ca; this workflow has no GitHub copy.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - LostOdysseyRecomp/gpu/**
      - shared/frame_generation/**
      - cmake/LoFrameGeneration.cmake
      - tools/patches/plume-lostodyssey.patch
      - tools/patches/plume-sdl3.patch
      - tools/tests/frame_generation/**
      - tools/tests/motion_replay/**
      - tools/tests/native_dlss_renderer_gpu_test.cpp
      - .gitea/workflows/fg-game-integration.yml
  pull_request:
    paths:
      - LostOdysseyRecomp/gpu/**
      - shared/frame_generation/**
      - cmake/LoFrameGeneration.cmake
      - tools/patches/plume-lostodyssey.patch
      - tools/patches/plume-sdl3.patch
      - tools/tests/frame_generation/**
      - tools/tests/motion_replay/**
      - tools/tests/native_dlss_renderer_gpu_test.cpp
      - .gitea/workflows/fg-game-integration.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Preserve source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize pinned public dependencies
        shell: bash
        run: |
          set -euo pipefail
          # win-t640 sets LO_GIT_REFERENCE to a local mirror of these upstreams;
          # objects missing from it are still fetched from GitHub.
          if [ -n "${LO_GIT_REFERENCE:-}" ]; then fetch=(--reference "$LO_GIT_REFERENCE"); else fetch=(--depth 1); fi
          git submodule update --init "${fetch[@]}" thirdparty/plume tools/XenosRecomp tools/XenonRecomp thirdparty/unordered_dense thirdparty/SDL
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
          git -C thirdparty/plume submodule update --init "${fetch[@]}" contrib/volk contrib/Vulkan-Headers contrib/VulkanMemoryAllocator contrib/D3D12MemoryAllocator
          git -C tools/XenosRecomp submodule update --init --recursive "${fetch[@]}"
          git -C tools/XenonRecomp submodule update --init "${fetch[@]}" thirdparty/tomlplusplus
      # actions/checkout would send the Gitea job token to github.com, which
      # rejects it; fetch the pinned public SDK headers without credentials.
      - name: Fetch pinned SDK headers
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            rm -rf "$3"
            git init -q "$3"
            git -C "$3" remote add origin "$1"
            git -C "$3" sparse-checkout set --cone "$4"
            git -C "$3" fetch -q --depth 1 --filter=blob:none origin "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          fetch https://github.com/NVIDIA-RTX/Streamline.git 2122257e0fce486f91b385aa63b9a09b0a34b363 out/deps/streamline include
          fetch https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git c6efa6bf7f2027b3ec94f28578bb5965eabb9e55 out/deps/fidelityfx ffx-api/include
      - name: Configure actual game translation units
        shell: pwsh
        run: |
          cmake -S tools/tests/motion_replay -B out/fg-game -G 'Visual Studio 17 2022' -A x64 -T ClangCL -DLO_ENABLE_DLSS=OFF -DLO_ENABLE_FSR=OFF -DLO_P2_VIDEO_COMPILE_CHECK=ON -DLO_P2_VIDEO_SDL_HEADERS="$pwd/thirdparty/SDL/include" -DLO_FG_GAME_COMPILE_CHECK=ON -DLO_VULKAN_FG_GAME_COMPILE_CHECK=ON -DFRAMEGEN_WITH_DLSS=ON -DFRAMEGEN_WITH_FSR=ON -DFRAMEGEN_STREAMLINE_INCLUDE="$pwd/out/deps/streamline/include" -DFRAMEGEN_FIDELITYFX_INCLUDE="$pwd/out/deps/fidelityfx/ffx-api/include" 2>&1 | Tee-Object out/fg-game-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile production renderer, video, bridge and link selected adapters
        shell: pwsh
        run: |
          cmake --build out/fg-game --config Release --target motion_renderer_compile p2_video_compile fg_vulkan_compile LoFgGameBridgeLink LoFgGameInputTest --parallel 8 2>&1 | Tee-Object out/fg-game-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/fg-game/Release/LoFgGameBridgeLink.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir out/fg-game -C Release --output-on-failure -R '^fg_game_input_contract$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'COMPILE_AND_CPU_ONLY: no SDK runtime, game launch or GPU acceptance performed'
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        if: always()
        with:
          name: fg-game-compile-logs
          path: out/fg-game-*.log
          retention-days: 7
  # Mirror the result onto the GitHub commit so pull requests show it. Needs a
  # Gitea secret LO_GITHUB_TOKEN (fine-grained PAT, Commit statuses: write).
  github-status:
    needs: [windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report to GitHub
        env:
          LO_GITHUB_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
          RESULTS: ${{ needs.windows.result }}
          CONTEXT: gitea/fg-game-integration
          RUN_URL: https://git.zkx.ca/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          if [ -z "$LO_GITHUB_TOKEN" ]; then echo 'LO_GITHUB_TOKEN is not set; skipping'; exit 0; fi
          state=success
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; cancelled) [ "$state" = failure ] || state=error ;; *) state=failure ;; esac
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LO_GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/freefrank/LostOdysseyRecomp/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"$CONTEXT\",\"description\":\"Gitea Actions: $RESULTS\",\"target_url\":\"$RUN_URL\"}") || true
          echo "GitHub status $state for $GITHUB_SHA -> HTTP $code"
