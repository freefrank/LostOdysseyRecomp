name: FG CPU contracts

# Pull request checks run on git.zkx.ca; this workflow has no GitHub copy.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '.gitea/workflows/fg-cpu-contracts.yml'
      - 'LostOdysseyRecomp/gpu/fsr_fg_*.h'
      - 'LostOdysseyRecomp/gpu/fsr_frame_generation_vulkan.*'
      - 'LostOdysseyRecomp/gpu/metalfx_*'
      - 'LostOdysseyRecomp/gpu/optiscaler_*'
      - 'tools/tests/optiscaler/**'
      - 'shared/frame_generation/**'
      - 'tools/patches/plume-lostodyssey.patch'
      - 'LostOdysseyRecomp/gpu/dlss_fg_*.h'
      - 'LostOdysseyRecomp/gpu/dlss_ngx.*'
      - 'LostOdysseyRecomp/gpu/temporal_upscaler.*'
      - 'LostOdysseyRecomp/gpu/streamline_vulkan_dispatch.*'
      - 'LostOdysseyRecomp/gpu/renderer.cpp'
      - 'LostOdysseyRecomp/gpu/video.*'
      - 'LostOdysseyRecomp/gpu/command_processor.*'
      - 'LostOdysseyRecomp/gpu/dlss_frame_generation.*'
      - 'LostOdysseyRecomp/gpu/frame_generation_composite.h'
      - 'LostOdysseyRecomp/gpu/temporal_frame_inputs.h'
      - 'tools/tests/streamline_fg/**'
      - 'tools/tests/settings_menu/**'
      - 'LostOdysseyRecomp/gpu/frame_generation_settings.h'
      - 'LostOdysseyRecomp/settings/menu.cpp'
      - 'LostOdysseyRecomp/settings/menu.h'
      - 'LostOdysseyRecomp/settings/graphics_menu.h'
      - 'LostOdysseyRecomp/settings/menu_render.cpp'
      - 'LostOdysseyRecomp/settings/translations.h'
      - 'LostOdysseyRecomp/settings/config.h'
      - 'tools/tests/temporal_frame_inputs_test.cpp'
      - 'tools/tests/temporal_upscaler_contract_test.cpp'
      - 'tools/tests/frame_plan_test.cpp'
      - 'tools/tests/native_dlss_submission_lifetime_test.cpp'
      - 'LostOdysseyRecomp/gpu/frame_plan.h'
      - 'LostOdysseyRecomp/gpu/upscaling_plan.*'
  pull_request:
    paths:
      - '.gitea/workflows/fg-cpu-contracts.yml'
      - 'LostOdysseyRecomp/gpu/fsr_fg_*.h'
      - 'LostOdysseyRecomp/gpu/fsr_frame_generation_vulkan.*'
      - 'LostOdysseyRecomp/gpu/metalfx_*'
      - 'LostOdysseyRecomp/gpu/optiscaler_*'
      - 'tools/tests/optiscaler/**'
      - 'shared/frame_generation/**'
      - 'tools/patches/plume-lostodyssey.patch'
      - 'LostOdysseyRecomp/gpu/dlss_fg_*.h'
      - 'LostOdysseyRecomp/gpu/dlss_ngx.*'
      - 'LostOdysseyRecomp/gpu/temporal_upscaler.*'
      - 'LostOdysseyRecomp/gpu/streamline_vulkan_dispatch.*'
      - 'LostOdysseyRecomp/gpu/renderer.cpp'
      - 'LostOdysseyRecomp/gpu/video.*'
      - 'LostOdysseyRecomp/gpu/command_processor.*'
      - 'LostOdysseyRecomp/gpu/dlss_frame_generation.*'
      - 'LostOdysseyRecomp/gpu/frame_generation_composite.h'
      - 'LostOdysseyRecomp/gpu/temporal_frame_inputs.h'
      - 'tools/tests/streamline_fg/**'
      - 'tools/tests/settings_menu/**'
      - 'LostOdysseyRecomp/gpu/frame_generation_settings.h'
      - 'LostOdysseyRecomp/settings/menu.cpp'
      - 'LostOdysseyRecomp/settings/menu.h'
      - 'LostOdysseyRecomp/settings/graphics_menu.h'
      - 'LostOdysseyRecomp/settings/menu_render.cpp'
      - 'LostOdysseyRecomp/settings/translations.h'
      - 'LostOdysseyRecomp/settings/config.h'
      - 'tools/tests/temporal_frame_inputs_test.cpp'
      - 'tools/tests/temporal_upscaler_contract_test.cpp'
      - 'tools/tests/frame_plan_test.cpp'
      - 'tools/tests/native_dlss_submission_lifetime_test.cpp'
      - 'LostOdysseyRecomp/gpu/frame_plan.h'
      - 'LostOdysseyRecomp/gpu/upscaling_plan.*'

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends cmake g++ python3
      - name: Configure GPU-free contracts
        run: cmake -S tools/tests/streamline_fg -B build/fg-contracts -DLO_STREAMLINE_FG_CPU_ONLY=ON
      - name: Build
        run: cmake --build build/fg-contracts --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/fg-contracts -C Release --output-on-failure
      - name: Preserve contract log
        if: always()
        uses: actions/upload-artifact@v3 # Gitea does not support v4
        with:
          name: fg-contracts-${{ matrix.os }}
          path: build/fg-contracts/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
  # Mirror the result onto the GitHub commit so pull requests show it. Needs a
  # Gitea secret LO_GITHUB_TOKEN (fine-grained PAT, Commit statuses: write).
  github-status:
    needs: [contracts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report to GitHub
        env:
          LO_GITHUB_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
          RESULTS: ${{ needs.contracts.result }}
          CONTEXT: gitea/fg-cpu-contracts
          RUN_URL: https://git.zkx.ca/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          if [ -z "$LO_GITHUB_TOKEN" ]; then echo 'LO_GITHUB_TOKEN is not set; skipping'; exit 0; fi
          state=success
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; cancelled) [ "$state" = failure ] || state=error ;; *) state=failure ;; esac
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LO_GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/freefrank/LostOdysseyRecomp/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"$CONTEXT\",\"description\":\"Gitea Actions: $RESULTS\",\"target_url\":\"$RUN_URL\"}") || true
          echo "GitHub status $state for $GITHUB_SHA -> HTTP $code"
