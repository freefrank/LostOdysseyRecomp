name: Release

# Gitea copy of .github/workflows/release.yml, run on git.zkx.ca. Differences:
# - GitHub release operations use the LO_GITHUB_TOKEN secret (fine-grained PAT:
#   Contents and Commit statuses read/write) instead of the job token, with
#   GH_REPO pinned to the GitHub repository; the same token reads the private
#   build-input repository over HTTPS (no deploy key).
# - Windows jobs run on win-t640 with its system Python in a per-job venv;
#   Linux packaging runs on the repository's privileged docker runner, which
#   Flatpak's bubblewrap needs.
# - upload/download-artifact v3 (Gitea rejects v4); higher build parallelism.
# - Publishing a version: push the tag to GitHub first (gh release create
#   --verify-tag), then to zkx, which triggers this workflow.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to package; empty builds the selected ref'
        type: string
        required: false

  push:
    tags: ['v*']

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  GH_REPO: freefrank/LostOdysseyRecomp

permissions:
  contents: read

jobs:
  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Install GitHub CLI
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar -xz -C /tmp
          echo /tmp/gh_2.63.2_linux_amd64/bin >> "$GITHUB_PATH"
      - name: Create draft release if missing
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; not recreating."
            exit 0
          fi
          mkdir -p out/releases
          python3 tools/release/extract_release_notes.py --changelog CHANGELOG.md --version "$RELEASE_TAG" --output out/releases/release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file out/releases/release-notes.md

  prepare-fsr:
    name: Prepare FSR Vulkan build inputs
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      # On the Windows host runner a second actions/checkout in the same job
      # fails: act re-fetches its cached copy of the action and Windows denies
      # access to the replaced pack file. Other repositories use plain git.
      - name: Checkout pinned FidelityFX SDK
        run: |
          $dir = 'out/deps/fidelityfx-sdk'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          git init -q $dir
          git -C $dir remote add origin https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git
          git -C $dir sparse-checkout set --no-cone /LICENSE.txt /ffx-api/include/ /PrebuiltSignedDLL/amd_fidelityfx_dx12.dll /sdk/include/ /sdk/src/shared/ /sdk/src/components/fsr3upscaler/ /sdk/src/backends/shared/ /sdk/src/backends/vk/ /sdk/src/backends/dx12/ /sdk/tools/binary_store/
          git -C $dir fetch -q --depth 1 --filter=blob:none origin c6efa6bf7f2027b3ec94f28578bb5965eabb9e55
          if ($LASTEXITCODE -ne 0) { throw 'FidelityFX SDK fetch failed.' }
          git -C $dir checkout -q FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'FidelityFX SDK checkout failed.' }
      - name: Generate FSR Vulkan shaders
        shell: cmd
        run: |
          python tools/fsr/generate_shaders.py --sdk out/deps/fidelityfx-sdk --output out/fsr-shaders-vk --threads 16 || exit /b 1
          python tools/fsr/prepare_adapter_shaders.py --glslang out/deps/fidelityfx-sdk/sdk/tools/binary_store/glslangValidator.exe --output out/fsr-shaders-vk || exit /b 1
      - name: Generate FSR D3D12 shaders
        shell: cmd
        run: |
          rem win-t640 sets LO_GIT_REFERENCE to a local mirror of the submodule upstreams.
          set "SUBMODULE_REFERENCE="
          if defined LO_GIT_REFERENCE set "SUBMODULE_REFERENCE=--reference %LO_GIT_REFERENCE%"
          git submodule update --init --recursive %SUBMODULE_REFERENCE% tools/XenosRecomp || exit /b 1
          python tools/fsr/generate_dx12_shaders.py --sdk out/deps/fidelityfx-sdk --dxc-dir tools/XenosRecomp/thirdparty/dxc-bin/bin/x64 --output out/fsr-shaders-dx12 --threads 16 || exit /b 1
          python tools/fsr/prepare_adapter_shaders_dx12.py --dxc tools/XenosRecomp/thirdparty/dxc-bin/bin/x64/dxc.exe --output out/fsr-adapter-dx12 || exit /b 1
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        with:
          name: fsr-vulkan-build-inputs
          path: |
            out/deps/fidelityfx-sdk/sdk
            out/deps/fidelityfx-sdk/ffx-api/include
            out/deps/fidelityfx-sdk/PrebuiltSignedDLL/amd_fidelityfx_dx12.dll
            out/deps/fidelityfx-sdk/LICENSE.txt
            out/fsr-shaders-vk
            out/fsr-shaders-dx12
            out/fsr-adapter-dx12
          if-no-files-found: error

  release-windows:
    name: Windows Release
    needs: [create-draft-release, prepare-fsr]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9][0-9A-Za-z.+-]*$') { throw 'Expected a version tag starting with v.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          # win-t640 sets LO_GIT_REFERENCE to a local mirror of the submodule
          # upstreams; objects missing from it are still fetched from GitHub.
          if [ -n "${LO_GIT_REFERENCE:-}" ]; then fetch=(--reference "$LO_GIT_REFERENCE"); else fetch=(); fi
          git submodule update --init --recursive "${fetch[@]}"
      - uses: actions/download-artifact@v3
        with:
          name: fsr-vulkan-build-inputs
          path: out
      - name: Install packaging tools
        run: |
          python -m venv out/venv
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed.' }
          Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path out/venv/Scripts).Path
          out/venv/Scripts/python -m pip install -r tools/release/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed.' }
      # Plain git instead of a second actions/checkout (see prepare-fsr). The
      # token reaches git through GIT_CONFIG_* variables, so it is neither on a
      # command line nor written to .git/config.
      - name: Retrieve private build inputs
        env:
          GH_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          foreach ($item in @(
              @{ Path = 'out/build-input'; Ref = '77f076e0e03966736cbf8919ce793bafadce82d9'; Pattern = '/default.xex' })) {
            if (Test-Path $item.Path) { Remove-Item -Recurse -Force $item.Path }
            git init -q $item.Path
            git -C $item.Path remote add origin https://github.com/freefrank/LostOdysseyRecomp-build-inputs.git
            git -C $item.Path sparse-checkout set --no-cone $item.Pattern
            git -C $item.Path fetch -q --depth 1 --filter=blob:none origin $item.Ref
            if ($LASTEXITCODE -ne 0) { throw "Private build input fetch failed: $($item.Path)" }
            git -C $item.Path checkout -q FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "Private build input checkout failed: $($item.Path)" }
          }
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Fetch NVIDIA DLSS SDK
        run: python tools/release/fetch_dlss_sdk.py --dest out/deps/nvidia-dlss
      - name: Fetch pinned NVIDIA Streamline SDK
        env:
          GH_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
        run: |
          $zip = 'streamline-sdk-v2.14.1.zip'
          New-Item -ItemType Directory -Force out/deps | Out-Null
          # The runner cache (LO_CI_CACHE) keeps the archive once it has passed verification.
          $cached = if ($env:LO_CI_CACHE) { Join-Path $env:LO_CI_CACHE "streamline/$zip" }
          if ($cached -and (Test-Path -LiteralPath $cached)) {
            Copy-Item -LiteralPath $cached -Destination out/deps
          } else {
            gh release download v2.14.1 --repo NVIDIA-RTX/Streamline --pattern $zip --dir out/deps --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Official Streamline SDK download failed.' }
          }
          python tools/release/prepare_streamline_sdk.py --archive out/deps/$zip --dest out/deps/streamline
          if ($LASTEXITCODE -ne 0) {
            if ($cached) { Remove-Item -LiteralPath $cached -ErrorAction SilentlyContinue }
            throw 'Pinned Streamline SDK verification failed.'
          }
          if ($cached -and -not (Test-Path -LiteralPath $cached)) {
            New-Item -ItemType Directory -Force (Split-Path $cached) | Out-Null
            Copy-Item -LiteralPath out/deps/$zip -Destination "$cached.tmp-$PID"
            Move-Item -LiteralPath "$cached.tmp-$PID" -Destination $cached -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "$cached.tmp-$PID" -ErrorAction SilentlyContinue
          }
      - name: Fetch pinned Intel XeSS SDK
        env:
          GH_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
        run: |
          $zip = 'XeSS_SDK_3.0.2.zip'
          New-Item -ItemType Directory -Force out/deps | Out-Null
          $cached = if ($env:LO_CI_CACHE) { Join-Path $env:LO_CI_CACHE "xess/$zip" }
          if ($cached -and (Test-Path -LiteralPath $cached)) {
            Copy-Item -LiteralPath $cached -Destination out/deps
          } else {
            gh release download v3.0.2 --repo intel/xess --pattern $zip --dir out/deps --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Official XeSS SDK download failed.' }
          }
          python tools/release/prepare_xess_sdk.py --archive out/deps/$zip --dest out/deps/xess
          if ($LASTEXITCODE -ne 0) {
            if ($cached) { Remove-Item -LiteralPath $cached -ErrorAction SilentlyContinue }
            throw 'Pinned XeSS SDK verification failed.'
          }
          if ($cached -and -not (Test-Path -LiteralPath $cached)) {
            New-Item -ItemType Directory -Force (Split-Path $cached) | Out-Null
            Copy-Item -LiteralPath out/deps/$zip -Destination "$cached.tmp-$PID"
            Move-Item -LiteralPath "$cached.tmp-$PID" -Destination $cached -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "$cached.tmp-$PID" -ErrorAction SilentlyContinue
          }
      - name: Configure compiler cache
        run: |
          # win-t640 has ccache on PATH and LO_CI_CACHE set. Generated PPC units
          # only change with the XEX or the recompiler, so most objects hit.
          # BASEDIR makes the per-job workspace path irrelevant to the hash.
          $ccache = Get-Command ccache -ErrorAction SilentlyContinue
          if (-not $ccache -or -not $env:LO_CI_CACHE) { Write-Host 'No compiler cache on this runner.'; exit 0 }
          $env:CCACHE_DIR = Join-Path $env:LO_CI_CACHE 'ccache'
          @(
            "CMAKE_C_COMPILER_LAUNCHER=$($ccache.Source)",
            "CMAKE_CXX_COMPILER_LAUNCHER=$($ccache.Source)",
            "CCACHE_DIR=$env:CCACHE_DIR",
            "CCACHE_BASEDIR=$($env:GITHUB_WORKSPACE -replace '\\', '/')",
            'CCACHE_NOHASHDIR=1',
            'CCACHE_MAXSIZE=20G'
          ) | Add-Content -Path $env:GITHUB_ENV
          & $ccache.Source --zero-stats | Out-Null
      - name: Generate game code
        shell: cmd
        run: |
          call tools\build_tools.bat || exit /b 1
          out\build\tools\xexdump.exe LostOdysseyRecompLib\private\disc1\default.xex LostOdysseyRecompLib\private\image_disc1.bin || exit /b 1
          python tools\ppc_codegen.py generate || exit /b 1
      - name: Build Release
        shell: cmd
        env:
          # T640's 64 threads are shared with the Linux release VM.
          LO_BUILD_JOBS: '24'
          LO_ENABLE_DLSS: 'ON'
          LO_REQUIRE_DLSS: 'ON'
          LO_DLSS_SDK_ROOT: out\deps\nvidia-dlss
          LO_ENABLE_STREAMLINE_FG: 'ON'
          LO_ENABLE_D3D12_DLSS_FG: 'ON'
          LO_ENABLE_FSR_FG: 'ON'
          LO_STREAMLINE_SDK_ROOT: ${{ github.workspace }}/out/deps/streamline
          LO_FSR_FG_RUNTIME: ${{ github.workspace }}/out/deps/fidelityfx-sdk/PrebuiltSignedDLL/amd_fidelityfx_dx12.dll
          LO_ENABLE_FSR: 'ON'
          LO_REQUIRE_FSR: 'ON'
          LO_FSR_SDK_ROOT: ${{ github.workspace }}/out/deps/fidelityfx-sdk
          LO_FSR_SHADER_DIR: ${{ github.workspace }}/out/fsr-shaders-vk
          LO_FSR_DX12_SHADER_DIR: ${{ github.workspace }}/out/fsr-shaders-dx12
          LO_FSR_DX12_ADAPTER_DIR: ${{ github.workspace }}/out/fsr-adapter-dx12
          LO_ENABLE_XESS: 'ON'
          LO_ENABLE_XESS_FG: 'ON'
          LO_XESS_SDK_ROOT: ${{ github.workspace }}/out/deps/xess
        run: call tools\build_release.bat
      - name: Compiler cache statistics
        if: always() && env.CMAKE_CXX_COMPILER_LAUNCHER != ''
        run: |
          & $env:CMAKE_CXX_COMPILER_LAUNCHER --show-stats
          exit 0
      - name: Stage FG runtime dependencies
        run: |
          $runtime = 'out/build/release/LostOdysseyRecomp'
          Copy-Item -LiteralPath out/deps/streamline/bin/x64/NvLowLatencyVk.dll -Destination $runtime
          foreach ($dll in @('sl.interposer.dll', 'sl.common.dll', 'sl.dlss_g.dll', 'sl.reflex.dll', 'sl.pcl.dll', 'nvngx_dlssg.dll', 'NvLowLatencyVk.dll', 'amd_fidelityfx_dx12.dll', 'libxess.dll', 'libxess_fg.dll', 'libxell.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $dll) -PathType Leaf)) { throw "FG runtime missing after build: $dll" }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $install) { throw 'Visual Studio installation not found.' }
          $redist = Get-ChildItem -LiteralPath (Join-Path $install 'VC/Redist/MSVC') -Directory |
            Where-Object { $_.Name -match '^[0-9]' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'x64/Microsoft.VC143.CRT/msvcp140.dll')) } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $redist) { throw 'Official x64 VC143 redistributable files not found.' }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $source = Join-Path $redist.FullName "x64/Microsoft.VC143.CRT/$dll"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "VC143 redistributable file missing: $dll" }
            Copy-Item -LiteralPath $source -Destination $runtime
          }
      - name: Package runtime
        run: |
          if (-not (Test-Path -LiteralPath out/build/release/LostOdysseyRecomp/licenses/LICENSE-FidelityFX.txt -PathType Leaf)) {
            throw 'FSR license was not staged by the Windows runtime build.'
          }
          if ($env:RELEASE_TAG) {
            python tools/package_release.py --version $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
          } else {
            python tools/package_release.py
          }
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        with:
          name: LostOdysseyRecomp-windows-x64
          path: out/releases/LostOdysseyRecomp-*.zip
          if-no-files-found: error

  release-linux:
    name: Linux Release
    needs: [create-draft-release, prepare-fsr]
    # Build the runtime AND all bundled dependencies against glibc 2.35.
    runs-on: ubuntu-22.04-privileged
    timeout-minutes: 360
    env:
      FLATPAK_OUTPUT: ${{ github.workspace }}/out/flatpak/ci-${{ github.run_id }}
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Expected a version tag starting with v." >&2
            exit 1
          fi
      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar -xz -C /tmp
          echo /tmp/gh_2.63.2_linux_amd64/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v3
        with:
          name: fsr-vulkan-build-inputs
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline-compatible C++23 toolchain
        run: bash tools/release/install_appimage_toolchain.sh
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libcurl4-openssl-dev \
            libvulkan-dev \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libdecor-0-dev \
            libdbus-1-dev \
            libudev-dev \
            file \
            wget \
            ccache
          # Jammy's distribution CMake predates the project's 3.28 minimum.
          python -m pip install 'cmake==3.31.6' -r tools/release/requirements.txt
          python -m unittest discover -s tools/tests -p test_appimage_compat.py
      - name: Configure compiler cache
        run: |
          # The privileged runner sets LO_CI_CACHE to a persistent volume. Generated
          # PPC units only change with the XEX or the recompiler, so most objects
          # hit; BASEDIR makes the per-job workspace path irrelevant to the hash.
          if [ -z "${LO_CI_CACHE:-}" ]; then echo 'No compiler cache on this runner.'; exit 0; fi
          {
            echo "CMAKE_C_COMPILER_LAUNCHER=$(command -v ccache)"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=$(command -v ccache)"
            echo "CCACHE_DIR=$LO_CI_CACHE/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo 'CCACHE_NOHASHDIR=1'
            echo 'CCACHE_MAXSIZE=20G'
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$LO_CI_CACHE/ccache" ccache --zero-stats >/dev/null
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          token: ${{ secrets.LO_GITHUB_TOKEN }}
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-sdl3.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Fetch NVIDIA DLSS SDK
        run: python3 tools/release/fetch_dlss_sdk.py --dest out/deps/nvidia-dlss
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build Linux runtime
        run: |
          cmake -S . -B out/build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLO_ENABLE_DLSS=ON \
            -DLO_REQUIRE_DLSS=ON \
            -DLO_DLSS_SDK_ROOT="$GITHUB_WORKSPACE/out/deps/nvidia-dlss" \
            -DLO_ENABLE_FSR=ON \
            -DLO_REQUIRE_FSR=ON \
            -DLO_FSR_SDK_ROOT="$GITHUB_WORKSPACE/out/deps/fidelityfx-sdk" \
            -DLO_FSR_SHADER_DIR="$GITHUB_WORKSPACE/out/fsr-shaders-vk" \
            -DSDL_PIPEWIRE=ON -DSDL_PIPEWIRE_SHARED=ON
          grep -q '^#define SDL_AUDIO_DRIVER_PIPEWIRE 1' out/build/linux/thirdparty/SDL/include-config-release/build_config/SDL_build_config.h
          grep -q '^#define SDL_AUDIO_DRIVER_PIPEWIRE_DYNAMIC ' out/build/linux/thirdparty/SDL/include-config-release/build_config/SDL_build_config.h
          # The release VM shares T640's 64 threads with the Windows job; each
          # compiler process peaked below 0.5 GB of the VM's ~15 GB free memory.
          cmake --build out/build/linux --target LostOdysseyRecomp --parallel 20
      # Packages carry no shader pack: the game downloads the one for its
      # renderer from the shader-packs prerelease. A version needs packs for
      # all three contracts of its runtime published first.
      - name: Check published shader packs
        run: |
          cmake --build out/build/linux --target LoShaderPackTool --parallel 20
          tool=$(find out/build/linux -name LoShaderPackTool -type f | head -n 1)
          if ! python3 tools/release/publish_shader_packs.py --check --tool "$tool" --image LostOdysseyRecompLib/private/image_disc1.bin; then
            if [ -n "$RELEASE_TAG" ]; then exit 1; fi
            echo "::warning::No published shader packs for this runtime; a version release would stop here."
          fi
      - name: Compiler cache statistics
        if: always() && env.CMAKE_CXX_COMPILER_LAUNCHER != ''
        run: ccache --show-stats || true
      - name: Install linuxdeploy
        run: |
          mkdir -p out/tools/linuxdeploy
          wget -q -O out/tools/linuxdeploy/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x out/tools/linuxdeploy/linuxdeploy
          echo "$GITHUB_WORKSPACE/out/tools/linuxdeploy" >> "$GITHUB_PATH"
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [ ! -f out/build/linux/LostOdysseyRecomp/licenses/LICENSE-FidelityFX.txt ]; then
            echo 'FSR license was not staged by the Linux runtime build.' >&2
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            python tools/package_appimage.py --build out/build/linux --output out/releases --appdir out/releases/linux.AppDir --version "$RELEASE_TAG" --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          else
            python tools/package_appimage.py --build out/build/linux --output out/releases --appdir out/releases/linux.AppDir --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          fi
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        with:
          name: LostOdysseyRecomp-linux-x64
          path: out/releases/LostOdysseyRecomp-*.AppImage
          if-no-files-found: error
      - name: Reuse published Flatpak asset when available
        id: flatpak-release
        env:
          GH_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -Fxq -- "LostOdysseyRecomp-linux-x64-${RELEASE_TAG}.flatpak"; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo "Reusing the published Flatpak asset for $RELEASE_TAG."
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Install Flatpak packaging tools and runtime
        if: steps.flatpak-release.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          sudo flatpak --system remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak --system install -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08
          # The privileged runner keeps /var/lib/flatpak in a volume; bring a
          # kept runtime to the current commit, as a fresh install would be.
          sudo flatpak --system update -y --noninteractive \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08
      - name: Package Flatpak from the AppImage runtime
        if: steps.flatpak-release.outputs.build == 'true'
        run: |
          args=(--appdir out/releases/linux.AppDir --output "$FLATPAK_OUTPUT")
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--version "$RELEASE_TAG")
          fi
          python3 tools/package_flatpak.py "${args[@]}"
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        if: steps.flatpak-release.outputs.build == 'true'
        with:
          name: LostOdysseyRecomp-linux-x64-flatpak
          path: |
            ${{ env.FLATPAK_OUTPUT }}/*.flatpak
            ${{ env.FLATPAK_OUTPUT }}/source.json
          if-no-files-found: error

  release-android:
    name: Android Release
    needs: [create-draft-release]
    # Same host code generation as the Linux job, then tools/android/ci_build.sh
    # (shared with android-apk.yml). The privileged runner's LO_CI_CACHE keeps
    # the SDK/NDK, the Android DXC, the Gradle home and ccache. The APK is
    # signed with the project's debug keystore from build-inputs; there is no
    # release keystore (maintainer decision, 2026-10-03).
    runs-on: ubuntu-22.04-privileged
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host toolchain for the recompiler tools
        run: bash tools/release/install_appimage_toolchain.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build file unzip wget ccache openjdk-17-jdk-headless
          python -m pip install 'cmake==3.31.6'
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          token: ${{ secrets.LO_GITHUB_TOKEN }}
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 2ba529b72c68ae2ee01903d24f7eac55cbb900df
          path: out/build-input
          sparse-checkout: |
            /default.xex
            /android/libdxcompiler.so
            /android/debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build the APK
        run: bash tools/android/ci_build.sh
      - uses: actions/upload-artifact@v3 # Gitea does not support v4
        with:
          name: LostOdysseyRecomp-android-arm64
          path: out/apk/*.apk
          if-no-files-found: error

  # The build jobs only produce Gitea artifacts. Writing to the GitHub release
  # happens here, after all platforms have built.
  publish-release:
    name: Publish complete release
    needs: [release-windows, release-linux, release-android]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
    steps:
      - name: Install GitHub CLI and jq
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar -xz -C /tmp
          echo /tmp/gh_2.63.2_linux_amd64/bin >> "$GITHUB_PATH"
          command -v jq >/dev/null || { SUDO=$(command -v sudo || true); $SUDO apt-get update && $SUDO apt-get install -y --no-install-recommends jq; }
      - uses: actions/download-artifact@v3
        with:
          name: LostOdysseyRecomp-windows-x64
          path: dist/LostOdysseyRecomp-windows-x64
      - uses: actions/download-artifact@v3
        with:
          name: LostOdysseyRecomp-linux-x64
          path: dist/LostOdysseyRecomp-linux-x64
      # Absent when the release already has the Flatpak bundle (see release-linux).
      - uses: actions/download-artifact@v3
        continue-on-error: true
        with:
          name: LostOdysseyRecomp-linux-x64-flatpak
          path: dist/LostOdysseyRecomp-linux-x64-flatpak
      - uses: actions/download-artifact@v3
        with:
          name: LostOdysseyRecomp-android-arm64
          path: dist/LostOdysseyRecomp-android-arm64
      - name: Upload Gitea artifacts to the GitHub release
        run: |
          set -euo pipefail
          packages=(
            "dist/LostOdysseyRecomp-windows-x64/LostOdysseyRecomp-windows-x64-${RELEASE_TAG}.zip"
            "dist/LostOdysseyRecomp-linux-x64/LostOdysseyRecomp-linux-x64-${RELEASE_TAG}.AppImage"
            "dist/LostOdysseyRecomp-linux-x64-flatpak/LostOdysseyRecomp-linux-x64-${RELEASE_TAG}.flatpak"
            "dist/LostOdysseyRecomp-android-arm64/LostOdysseyRecomp-android-arm64-${RELEASE_TAG}.apk"
          )
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          missing=()
          for file in "${packages[@]}"; do
            name=$(basename "$file")
            if grep -Fxq -- "$name" <<< "$existing"; then
              echo "$name is already on the release; preserving the reviewed asset."
            elif [ -f "$file" ]; then
              missing+=("$file")
            else
              echo "$name is neither on the release nor among the run's artifacts." >&2
              exit 1
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            ls -l "${missing[@]}"
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
      - name: Verify package set and publish draft
        run: |
          gh release view "$RELEASE_TAG" --json assets,isDraft > release.json
          python3 - <<'PY'
          import json, os
          tag = os.environ['RELEASE_TAG']
          assets = json.load(open('release.json'))['assets']
          expected = {
              f'LostOdysseyRecomp-windows-x64-{tag}.zip',
              f'LostOdysseyRecomp-linux-x64-{tag}.AppImage',
              f'LostOdysseyRecomp-linux-x64-{tag}.flatpak',
              f'LostOdysseyRecomp-android-arm64-{tag}.apk',
          }
          names = {asset['name'] for asset in assets}
          # The macOS disk image is built on a Mac and uploaded separately.
          optional = {f'LostOdysseyRecomp-macos-arm64-{tag}.dmg'}
          assert expected <= names <= expected | optional, 'Expected the installable packages and at most the macOS disk image; shader packs live on the shader-packs release'
          assert all(asset['size'] > 0 and asset['state'] == 'uploaded' for asset in assets), 'Incomplete release upload'
          PY
          if [ "$(jq -r '.isDraft' release.json)" != true ]; then
            echo 'Release is already public; preserving its publication state.'
            exit 0
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
