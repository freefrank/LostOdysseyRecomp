# Jump tables XenonAnalyse misses. Append this file to switch_tables.toml after regenerating it.

# Battle ring UI: absolute table at 0x82B14820, indexed by r10 after the
# range check at 0x82B14768 (lbz state - 4, four entries). Without this table,
# the bctr is treated as a tail call and skips sub_82B146A8's stack restoration.
[[switch]]
base = 0x82B14808
r = 10
default = 0x82B148BC
labels = [
    0x82B14830,
    0x82B14878,
    0x82B14890,
    0x82B148A4,
]

# ---- SHORT OFFSET JUMPTABLE (manual) ----
# 82FB21AC: lis r12,0x8217 ; addi r12,0x1340   -> u16 offset table at 0x82171340 (16 entries, range check cmplwi r24,0xF @82FB1E78)
# 82FB21BC: lis r12,0x82FB ; addi r12,0x1CA8   -> label base 0x82FB1CA8
[[switch]]
base = 0x82FB21AC
r = 24
default = 0x82FB21D4
labels = [
    0x82FB21D4,
    0x82FB21D4,
    0x82FB1CA8,
    0x82FB21D4,
    0x82FB21D4,
    0x82FB21D4,
    0x82FB21D4,
    0x82FB1CA8,
    0x82FB1CA8,
    0x82FB21D4,
    0x82FB1CA8,
    0x82FB1CA8,
    0x82FB21D4,
    0x82FB21D4,
    0x82FB21D4,
    0x82FB21D4,
]
