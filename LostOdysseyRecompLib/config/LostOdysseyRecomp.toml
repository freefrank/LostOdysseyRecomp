# XenonRecomp 配置模板
# 地址字段全部待填：在 Ghidra 里定位后替换 0x00000000。
# 格式参考 tools/XenonRecomp/README.md 与 UnleashedRecompLib/config/SWA.toml

[main]
file_path = "../private/disc1/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# 编译器生成的寄存器保存/恢复函数，用 XenonAnalyse 或 Ghidra 搜索
restgprlr_14_address = 0x82B7A700
savegprlr_14_address = 0x82B7A6B0
restfpr_14_address   = 0x82B7B17C
savefpr_14_address   = 0x82B7B130
restvmx_14_address   = 0x82DF2D98
savevmx_14_address   = 0x82DF2B00
restvmx_64_address   = 0x82DF2E2C
savevmx_64_address   = 0x82DF2B94

longjmp_address = 0x82DF3060
setjmp_address  = 0x82DF34A0

