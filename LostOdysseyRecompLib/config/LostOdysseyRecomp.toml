# XenonRecomp 配置模板
# 地址字段全部待填：在 Ghidra 里定位后替换 0x00000000。
# 格式参考 tools/XenonRecomp/README.md 与 UnleashedRecompLib/config/SWA.toml

[main]
file_path = "../private/disc1/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true
argument_as_local = true
fast_memory = true
