name: Native renderer verified integration publish
on:
  push:
    branches: [feature/native-renderer-front-end]
    paths: [.github/workflows/native-renderer-integrate.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Reapply identical compiled source by input and result hashes
        shell: bash
        run: |
          set -euo pipefail
          python tools/native_frontend_integrate.py
          mkdir -p out/native-p1
          echo 'Reuses successful Windows ClangCL CPU contracts and production renderer TU compilation from run 36540593846, job 109314785082. Only its push failed. Input and result SHA-256 are checked by the unchanged transformation script.' > out/native-p1/VALIDATION.txt
          sha256sum LostOdysseyRecomp/gpu/renderer.cpp LostOdysseyRecomp/gpu/renderer.h LostOdysseyRecomp/gpu/command_processor.cpp tools/tests/native_dlss_renderer_gpu_test.cpp > out/native-p1/SOURCE_SHA256.txt
      - name: Publish source-only commit without changing workflow history
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'dotSlash'
          git config user.email 'freefrank21@gmail.com'
          git rm tools/native_frontend_integrate.py
          git add LostOdysseyRecomp/gpu/renderer.cpp LostOdysseyRecomp/gpu/renderer.h LostOdysseyRecomp/gpu/command_processor.cpp tools/tests/native_dlss_renderer_gpu_test.cpp
          git commit -m 'refactor(renderer): consume explicit draw state through legacy adapter'
          git rev-parse HEAD > out/native-p1/COMMIT.txt
          git fetch origin feature/native-renderer-front-end
          git rebase FETCH_HEAD
          git rev-parse HEAD > out/native-p1/COMMIT.txt
          git push origin HEAD:refs/heads/feature/native-renderer-front-end
          echo 'PUSHED feature/native-renderer-front-end' > out/native-p1/PUSH.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-renderer-verified-source
          path: out/native-p1/*.txt
          retention-days: 7
