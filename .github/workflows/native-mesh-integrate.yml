name: Native mesh verified source publish
on:
  push:
    branches: [feature/native-renderer-front-end]
    paths: [.github/workflows/native-mesh-integrate.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Apply byte-identical compiled and SDK-verified source
        run: |
          python tools/native_mesh_stage.py
          echo 'Reuses Windows ClangCL production CP and producer compilation, CPU contracts, and SDK_ORACLE_PASS cases=128 predicates=pass,skip original_helpers=1334 native_flush_calls=0 from run 36544598596 / job 109327838754. Only its source staging failed due to CRLF paths. All source input/output hashes are revalidated.' > out/native-p2/VALIDATION.txt
      - name: Stage exact source manifest without platform newline assumptions
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          files = json.loads(Path('out/native-p2/SOURCE_SHA256.json').read_text())
          subprocess.run(['git','add','--',*[entry[0] for entry in files]],check=True)
          subprocess.run(['git','rm','tools/native_mesh_stage.py',*[f'tools/native-mesh-stage-{i}.b64' for i in range(3)]],check=True)
      - name: Commit and push verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name 'dotSlash'
          git config user.email 'freefrank21@gmail.com'
          git commit -m 'feat(gpu): intercept ordinary mesh before SDK flush with ordered native state'
          git fetch origin feature/native-renderer-front-end
          git rebase FETCH_HEAD
          git rev-parse HEAD > out/native-p2/COMMIT.txt
          git push origin HEAD:refs/heads/feature/native-renderer-front-end
          echo 'PUSHED feature/native-renderer-front-end' > out/native-p2/PUSH.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mesh-verified-source
          path: |
            out/native-p2/*.txt
            out/native-p2/SOURCE_SHA256.json
          retention-days: 7
