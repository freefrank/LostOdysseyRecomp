name: Vulkan presentation readbacks
on:
  workflow_dispatch:
  push:
    paths: ['LostOdysseyRecomp/gpu/presentation*', 'LostOdysseyRecomp/gpu/shader/sgsr1_source.h', 'tools/tests/presentation*', 'tools/tests/presentation/**', '.github/workflows/sgsr1-presentation.yml']
  pull_request:
    paths: ['LostOdysseyRecomp/gpu/presentation*', 'LostOdysseyRecomp/gpu/shader/sgsr1_source.h', 'tools/tests/presentation*', 'tools/tests/presentation/**', '.github/workflows/sgsr1-presentation.yml']
permissions:
  contents: read
jobs:
  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install software Vulkan and build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev mesa-vulkan-drivers libvulkan1
      - name: Apply pinned backend overlays
        run: |
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
      - name: Compile and run production presentation readbacks
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # Mesa versions use either filename for the same software ICD.
          if [ ! -f "$VK_DRIVER_FILES" ]; then export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json; fi
          cmake -S tools/tests/presentation -B out/verify/presentation -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/verify/presentation --parallel 3
          ctest --test-dir out/verify/presentation --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-presentation-readbacks
          path: out/verify/presentation/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
