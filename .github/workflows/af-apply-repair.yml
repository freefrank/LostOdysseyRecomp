name: Validate and publish AF repair
on:
  push:
    branches: [AF]
    paths:
      - 'tools/patches/af-repair-*'
      - '.github/workflows/af-apply-repair.yml'
permissions:
  contents: read
concurrency:
  group: af-repair-publish
  cancel-in-progress: false
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply checksum-verified repair
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64,lzma,hashlib; d=lzma.decompress(base64.b64decode(''.join(Path('tools/patches/af-repair-'+str(i)+'.b64').read_text() for i in range(5)))); assert hashlib.sha256(d).hexdigest()=='659e7ebbcabebedbbe9912350f53350b7c842e6e53c5e84c682895c2df2e4dde'; Path('af-repair.patch').write_bytes(d)"
          git apply --check af-repair.patch
          git apply af-repair.patch
          python tools/patches/af-repair-adjust.py
          git diff --check
      - name: Prepare pinned public sampler types
        shell: bash
        run: |
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y libx11-dev; fi
      - name: Test production palette and renderer methods
        shell: bash
        run: |
          sanitize=OFF
          if [ "$RUNNER_OS" = Linux ]; then sanitize=ON; fi
          cmake -S tools/tests/anisotropic_filtering -B out/af -DCMAKE_BUILD_TYPE=Debug -DLO_AF_SANITIZE=$sanitize
          cmake --build out/af --config Debug --parallel 2
          ctest --test-dir out/af -C Debug --output-on-failure
      - name: Test settings interaction and rasterization
        run: |
          cmake -S tools/tests/settings_menu -B out/settings-menu -DCMAKE_BUILD_TYPE=Release
          cmake --build out/settings-menu --config Release --parallel 2
          ctest --test-dir out/settings-menu -C Release --output-on-failure
  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply checksum-verified repair
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64,lzma,hashlib; d=lzma.decompress(base64.b64decode(''.join(Path('tools/patches/af-repair-'+str(i)+'.b64').read_text() for i in range(5)))); assert hashlib.sha256(d).hexdigest()=='659e7ebbcabebedbbe9912350f53350b7c842e6e53c5e84c682895c2df2e4dde'; Path('af-repair.patch').write_bytes(d)"
          git apply --check af-repair.patch
          git apply af-repair.patch
          python tools/patches/af-repair-adjust.py
      - name: Prepare pinned Plume backend
        run: |
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume submodule update --init --depth 1 contrib/volk contrib/Vulkan-Headers contrib/VulkanMemoryAllocator
      - name: Install software Vulkan and validation
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers
      - name: Execute native descriptor isolation and readback
        run: |
          cmake -S tools/tests/anisotropic_filtering -B out/af-vk -DCMAKE_BUILD_TYPE=Debug -DLO_AF_VULKAN_TEST=ON
          cmake --build out/af-vk --parallel 2
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          ctest --test-dir out/af-vk --output-on-failure
  publish:
    needs: [cpu, vulkan]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Store tested source blobs for maintainer commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/AF | cut -f1)" = "$EXPECTED_HEAD"
          python -c "from pathlib import Path; import base64,lzma,hashlib; d=lzma.decompress(base64.b64decode(''.join(Path('tools/patches/af-repair-'+str(i)+'.b64').read_text() for i in range(5)))); assert hashlib.sha256(d).hexdigest()=='659e7ebbcabebedbbe9912350f53350b7c842e6e53c5e84c682895c2df2e4dde'; Path('af-repair.patch').write_bytes(d)"
          git apply --check af-repair.patch
          git apply af-repair.patch
          python tools/patches/af-repair-adjust.py
          git diff --check
          python - <<'PY'
          import os, json, urllib.request
          from pathlib import Path
          paths = ['.github/workflows/af-regression.yml', 'LostOdysseyRecomp/gpu/renderer.cpp', 'LostOdysseyRecomp/gpu/sampler_description.h', 'LostOdysseyRecomp/gpu/sampler_palette.h', 'LostOdysseyRecomp/settings/config.cpp', 'LostOdysseyRecomp/settings/translations.h', 'docs/notes/anisotropic-filtering.md', 'tools/tests/anisotropic_filtering/CMakeLists.txt', 'tools/tests/anisotropic_filtering/generate_renderer_fixture.py', 'tools/tests/anisotropic_filtering/palette_test.cpp', 'tools/tests/anisotropic_filtering/sample.comp', 'tools/tests/anisotropic_filtering/vulkan_test.cpp', 'tools/tests/settings_menu/generate_runtime_fixture.py']
          entries = []
          for path in paths:
              body = json.dumps({'encoding': 'utf-8', 'content': Path(path).read_text(encoding='utf-8')}).encode()
              request = urllib.request.Request('https://api.github.com/repos/freefrank/LostOdysseyRecomp/git/blobs', data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'}, method='POST')
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response)['sha']
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          result = {'parent': os.environ['EXPECTED_HEAD'], 'entries': entries}
          Path('af-tested-blobs.json').write_text(json.dumps(result))
          print('AF_TESTED_BLOBS=' + json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: af-tested-blobs
          path: af-tested-blobs.json
          retention-days: 1
