name: FSR native compile contracts
on:
  push:
    branches: [FSR]
    paths:
      - 'LostOdysseyRecomp/gpu/fsr*'
      - 'LostOdysseyRecomp/gpu/temporal_upscaler*'
      - 'cmake/LoFsr*.cmake'
      - 'tools/fsr/**'
      - 'tools/tests/fsr/**'
      - 'tools/patches/plume-lostodyssey.patch'
      - '.github/workflows/fsr-native-compile.yml'
  pull_request:
    paths:
      - 'LostOdysseyRecomp/gpu/fsr*'
      - 'LostOdysseyRecomp/gpu/temporal_upscaler*'
      - 'cmake/LoFsr*.cmake'
      - 'tools/fsr/**'
      - 'tools/tests/fsr/**'
      - 'tools/patches/plume-lostodyssey.patch'
      - '.github/workflows/fsr-native-compile.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned public Plume headers
        run: |
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume submodule update --init --depth 1 contrib/volk contrib/Vulkan-Headers contrib/VulkanMemoryAllocator
      - uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: c6efa6bf7f2027b3ec94f28578bb5965eabb9e55
          path: out/fsr-sdk
          persist-credentials: false
          sparse-checkout: |
            sdk/include
            sdk/src/backends/vk
      - name: Install shader compilation tools (no GPU required)
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-dev glslang-tools spirv-tools
      - name: Compile native FSR on/off and run actual SDK selector regression
        run: bash tools/fsr/native_compile_check.sh out/fsr-sdk out/fsr-native-compile "$(command -v glslangValidator)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsr-native-compile-${{ github.sha }}
          path: |
            out/fsr-native-compile/sdk-memory-regression.json
            out/fsr-native-compile/shaders/adapter-manifest.json
          retention-days: 7
          if-no-files-found: warn
