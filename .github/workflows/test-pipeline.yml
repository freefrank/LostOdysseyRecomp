name: Pipeline tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LostOdysseyRecomp/gpu/pipeline_cache.h'
      - 'tools/tests/pipeline_cache_test.cpp'
      - 'tools/test.bat'
      - 'tools/tests/run.py'
      - '.github/workflows/test-pipeline.yml'
      - 'tools/setup_windows.bat'
  pull_request:
    paths:
      - 'LostOdysseyRecomp/gpu/pipeline_cache.h'
      - 'tools/tests/pipeline_cache_test.cpp'
      - 'tools/test.bat'
      - 'tools/tests/run.py'
      - '.github/workflows/test-pipeline.yml'
      - 'tools/setup_windows.bat'
permissions:
  contents: read
concurrency:
  group: tests-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pipeline fixtures
        shell: cmd
        run: call tools\test.bat pipeline
