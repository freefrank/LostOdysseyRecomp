name: FSR source dependency snapshot
on:
  push:
    branches: [FSR]
    paths: ['.github/workflows/fsr-source-deps.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned Plume source and headers only
        run: |
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume submodule update --init --depth 1 contrib/volk contrib/Vulkan-Headers contrib/VulkanMemoryAllocator
          git clone --filter=blob:none --no-checkout https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git /tmp/fsr-sdk
          git -C /tmp/fsr-sdk sparse-checkout init --cone
          git -C /tmp/fsr-sdk sparse-checkout set sdk/include sdk/src/backends/vk sdk/src/components/fsr3upscaler
          git -C /tmp/fsr-sdk checkout c6efa6bf7f2027b3ec94f28578bb5965eabb9e55
          tar --exclude=.git -czf /tmp/fsr-headers.tar.gz thirdparty/plume -C /tmp fsr-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: fsr-public-headers
          path: /tmp/fsr-headers.tar.gz
          retention-days: 1
          if-no-files-found: error
