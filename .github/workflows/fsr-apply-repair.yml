name: FSR repair verification and commit
on:
  push:
    branches: [FSR]
    paths: ['.github/workflows/fsr-apply-repair.yml']
permissions:
  contents: read
concurrency:
  group: fsr-repair-once
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve repository line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact locally reviewed patch
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess
          data = lzma.decompress(base64.b64decode(pathlib.Path('.github/fsr-repair.patch.xz.b64').read_bytes()))
          assert hashlib.sha256(data).hexdigest() == '05268b4b7897bc68f7b1eb339551289f9ebca7667bba5d5a1c320ca77b72056a'
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=data, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
      - name: Install Linux Xlib and shader development tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-dev glslang-tools spirv-tools
      - name: Prepare pinned Plume interface headers
        shell: bash
        run: |
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
      - name: CPU configure, build and tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/tests/native_dlss -B out/native-dlss-cpu -DLO_NATIVE_DLSS_CPU_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build out/native-dlss-cpu --config Release --target LoNativeDlssCpuTests --parallel 2
          ctest --test-dir out/native-dlss-cpu -C Release -L cpu --output-on-failure | tee out/cpu-results.txt
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: c6efa6bf7f2027b3ec94f28578bb5965eabb9e55
          path: out/fsr-sdk
          persist-credentials: false
          sparse-checkout: |
            sdk/include
            sdk/src/backends/vk
      - name: Compile the enabled and disabled native FSR adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git -C thirdparty/plume submodule update --init --depth 1 contrib/volk contrib/Vulkan-Headers contrib/VulkanMemoryAllocator
          bash tools/fsr/native_compile_check.sh out/fsr-sdk out/fsr-native-compile "$(command -v glslangValidator)" | tee out/native-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsr-repair-evidence-${{ matrix.os }}
          path: |
            out/cpu-results.txt
            out/native-results.txt
            out/fsr-native-compile/sdk-memory-regression.json
            out/fsr-native-compile/shaders/adapter-manifest.json
          retention-days: 7
          if-no-files-found: warn
  commit:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: FSR
          fetch-depth: 0
      - name: Guard against concurrent edits and commit only the tested patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['EXPECTED_HEAD']:
              raise RuntimeError('FSR advanced during validation; refusing to overwrite concurrent work')
          data = lzma.decompress(base64.b64decode(pathlib.Path('.github/fsr-repair.patch.xz.b64').read_bytes()))
          assert hashlib.sha256(data).hexdigest() == '05268b4b7897bc68f7b1eb339551289f9ebca7667bba5d5a1c320ca77b72056a'
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=data, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(fsr): recover transient dispatch failures and correct Vulkan memory selection', '-m', 'Validated on Linux/GCC and Windows/MSVC CPU contract suites and Linux native adapter compile-on/off. Includes a before/after regression of the pinned SDK memory selector. No game, full SDK link, or visual P2 acceptance claimed.'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/FSR'], check=True)
          subprocess.run(['git', 'bundle', 'create', '/tmp/fsr-validated.bundle', 'HEAD'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: fsr-validated-source
          path: /tmp/fsr-validated.bundle
          retention-days: 1
          if-no-files-found: error
