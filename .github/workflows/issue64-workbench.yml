name: Issue 64 workbench
on:
  push:
    branches: [fix/issue-64-hybrid-motion]
    paths: [.github/workflows/issue64-workbench.yml, tools/tests/issue64/**, LostOdysseyRecomp/gpu/sr_hybrid*, tools/tests/sr_hybrid*]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply pinned runtime integration
        run: python tools/tests/issue64/apply.py
      - name: Configure and build CPU contracts
        run: |
          cmake -S tools/tests/sr_hybrid -B out/hybrid-cpu -DCMAKE_BUILD_TYPE=Release
          cmake --build out/hybrid-cpu --config Release --parallel 2
      - name: Run CPU contracts
        run: ctest --test-dir out/hybrid-cpu -C Release -V
      - name: Sanitizers
        if: runner.os == 'Linux'
        run: |
          cmake -S tools/tests/sr_hybrid -B out/hybrid-asan -DLO_HYBRID_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build out/hybrid-asan --parallel 2
          ctest --test-dir out/hybrid-asan -V
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply pinned runtime integration
        run: python3 tools/tests/issue64/apply.py
      - name: Install public build and software Vulkan dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libx11-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools libzstd-dev
          git submodule update --init --depth 1 thirdparty/plume tools/XenosRecomp tools/XenonRecomp thirdparty/unordered_dense
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume submodule update --init --depth 1 contrib/volk contrib/Vulkan-Headers contrib/VulkanMemoryAllocator
          git -C tools/XenosRecomp submodule update --init --recursive --depth 1
          git -C tools/XenonRecomp submodule update --init --depth 1 thirdparty/tomlplusplus
          mkdir -p out/dxc
          curl --fail --location --retry 2 https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505.1/linux_dxc_2025_07_14.x86_64.tar.gz -o out/dxc.tar.gz
          echo 'f2213da1fc99dc8778c8823078e16ba97c7f80f86a1d4520ab1adf4b462bc48c  out/dxc.tar.gz' | sha256sum -c -
          tar -xzf out/dxc.tar.gz -C out/dxc
      - name: Compile actual renderer boundary and selected GPU fixtures
        run: |
          cmake -S tools/tests/motion_replay -B out/hybrid-gpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DLO_ENABLE_DLSS=OFF -DLO_ENABLE_FSR=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build out/hybrid-gpu --target sr_hybrid_motion_gpu_test motion_renderer_compile motion_replay_gpu_test temporal_aa_regression temporal_frame_inputs_test native_dlss_p2_routing_test motion_vector_test --parallel 2
      - name: Run actual Vulkan pixels and existing regressions
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PWD/out/dxc/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -1)"
          test -n "$VK_ICD_FILENAMES"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          mkdir -p out/vulkan-settings
          printf 'khronos_validation.debug_action = VK_DBG_LAYER_ACTION_LOG_MSG\nkhronos_validation.report_flags = error\n' > out/vulkan-settings/vk_layer_settings.txt
          export VK_LAYER_SETTINGS_PATH="$PWD/out/vulkan-settings"
          ctest --test-dir out/hybrid-gpu -V -R '^(sr_hybrid_motion_gpu|motion_replay_gpu|temporal_aa_legacy|temporal_frame_inputs|native_dlss_p2_routing|motion_vector)$' 2>&1 | tee out/hybrid-vulkan.log
          if grep -E 'Validation Error|VUID-' out/hybrid-vulkan.log; then exit 1; fi
      - name: Record source changes and inspection hints
        if: always()
        run: |
          git diff --stat
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p=Path('LostOdysseyRecomp/settings/menu.cpp')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
            if 'FSR has no submitted output' in line:
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(max(0,i-25),min(len(lines),i+10))))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue64-validation-logs
          path: |
            out/hybrid-vulkan.log
            out/hybrid-gpu/Testing/Temporary/LastTest.log
            out/hybrid-gpu/compile_commands.json
          if-no-files-found: ignore
