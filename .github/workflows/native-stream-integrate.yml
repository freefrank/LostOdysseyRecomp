name: Native stream verified source publish
on:
  push:
    branches: [feature/native-renderer-front-end]
    paths: [.github/workflows/native-stream-integrate.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Reapply identical compiled and SDK-verified source
        run: |
          python tools/native_stream_stage.py
          echo 'Reuses Windows ClangCL production CP/producer compile, mesh/probe CPU contracts and SDK_ORACLE_PASS cases=128 predicates=pass,skip stream_wait_order=verified original_helpers=1451 native_flush_calls=0 from run 36546697149 / job 109334695786. Source staging alone rejected one blank EOF line. All runtime input/output hashes are revalidated.' > out/native-p3/VALIDATION.txt
      - name: Normalize Python EOF without changing its syntax tree; stage exact files
        shell: python
        run: |
          from pathlib import Path
          import ast,hashlib,json,subprocess
          path=Path('tools/perf/native_probe_log.py')
          before=path.read_bytes();after=before.rstrip(b'\r\n')+b'\n'
          assert ast.dump(ast.parse(before))==ast.dump(ast.parse(after))
          path.write_bytes(after)
          files=json.loads(Path('out/native-p3/SOURCE_SHA256.json').read_text())
          Path('out/native-p3/EOF_CLEANUP.txt').write_text('Only native_probe_log.py EOF normalized; AST identical. Published SHA256: '+hashlib.sha256(after).hexdigest()+'\n')
          subprocess.run(['git','add','--',*[entry[0] for entry in files]],check=True)
          subprocess.run(['git','rm','tools/native_stream_stage.py','tools/native-stream-stage.b64'],check=True)
      - name: Commit and push verified source
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name 'dotSlash'
          git config user.email 'freefrank21@gmail.com'
          git commit -m 'feat(gpu): replace mesh stream PM4 waits with shared native coherency'
          git fetch origin feature/native-renderer-front-end
          git rebase FETCH_HEAD
          git rev-parse HEAD > out/native-p3/COMMIT.txt
          git push origin HEAD:refs/heads/feature/native-renderer-front-end
          echo 'PUSHED feature/native-renderer-front-end' > out/native-p3/PUSH.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stream-verified-source
          path: |
            out/native-p3/*.txt
            out/native-p3/SOURCE_SHA256.json
          retention-days: 7
