name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer and install packaging tools
        run: |
          python -m unittest discover -s tools/tests -p test_import_game.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r tools/release/requirements.txt
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 0f119ca8d91c94cf09fd2ecd8268229d8b1eeb97
          path: out/build-input
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Generate game code
        shell: cmd
        run: |
          call tools\build_tools.bat || exit /b 1
          out\build\tools\xexdump.exe LostOdysseyRecompLib\private\disc1\default.xex LostOdysseyRecompLib\private\image_disc1.bin || exit /b 1
          out\build\tools\XenonRecomp\XenonRecomp\XenonRecomp.exe LostOdysseyRecompLib\config\LostOdysseyRecomp.toml tools\XenonRecomp\XenonUtils\ppc_context.h || exit /b 1
      - name: Build Release
        shell: cmd
        env:
          LO_BUILD_JOBS: '2'
        run: call tools\build_release.bat
      - name: Test installed disc selection
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          cmake --build out/build/release --target LoStorageTest --parallel 2 || exit /b 1
          python tools/tests/disc_set_test.py out/build/release/LostOdysseyRecomp/LoStorageTest.exe || exit /b 1
      - name: Package runtime and importer
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            python tools/package_release.py --version $env:GITHUB_REF_NAME
          } else {
            python tools/package_release.py
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-windows-x64
          path: |
            out/releases/LostOdysseyRecomp-*.zip
            out/releases/LostOdysseyRecomp-*.sha256
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem out/releases/LostOdysseyRecomp-*.zip,out/releases/LostOdysseyRecomp-*.sha256 | ForEach-Object FullName
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; preserving its reviewed assets.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --generate-notes @assets
