name: Release

# GitHub-hosted packaging; an empty release_tag is a build-only rehearsal.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to package; empty builds the selected ref'
        type: string
        required: false

  push:
    tags: ['v*']

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  GH_REPO: freefrank/LostOdysseyRecomp

permissions:
  contents: read

jobs:
  create-draft-release:
    name: Create draft release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Create draft release if missing
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; not recreating."
            exit 0
          fi
          mkdir -p out/releases
          python3 tools/release/extract_release_notes.py --changelog CHANGELOG.md --version "$RELEASE_TAG" --output out/releases/release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file out/releases/release-notes.md

  prepare-fsr:
    name: Prepare FSR Vulkan build inputs
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Resolve FSR input versions
        id: fsr-versions
        run: '"xenos=$(git rev-parse HEAD:tools/XenosRecomp)" >> $env:GITHUB_OUTPUT'
      - name: Cache generated FSR build inputs
        id: fsr-cache
        uses: actions/cache@v4
        with:
          path: |
            out/deps/fidelityfx-sdk/sdk
            out/deps/fidelityfx-sdk/ffx-api/include
            out/deps/fidelityfx-sdk/PrebuiltSignedDLL/amd_fidelityfx_dx12.dll
            out/deps/fidelityfx-sdk/LICENSE.txt
            out/fsr-shaders-vk
            out/fsr-shaders-dx12
            out/fsr-adapter-dx12
          key: Windows-fsr-c6efa6bf7f2027b3ec94f28578bb5965eabb9e55-${{ steps.fsr-versions.outputs.xenos }}-${{ hashFiles('tools/fsr/**', 'LostOdysseyRecomp/gpu/shaders/fsr_prepare.*') }}
      - name: Checkout pinned FidelityFX SDK
        if: steps.fsr-cache.outputs.cache-hit != 'true'
        run: |
          $dir = 'out/deps/fidelityfx-sdk'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          git init -q $dir
          git -C $dir remote add origin https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git
          git -C $dir sparse-checkout set --no-cone /LICENSE.txt /ffx-api/include/ /PrebuiltSignedDLL/amd_fidelityfx_dx12.dll /sdk/include/ /sdk/src/shared/ /sdk/src/components/fsr3upscaler/ /sdk/src/backends/shared/ /sdk/src/backends/vk/ /sdk/src/backends/dx12/ /sdk/tools/binary_store/
          git -C $dir fetch -q --depth 1 --filter=blob:none origin c6efa6bf7f2027b3ec94f28578bb5965eabb9e55
          if ($LASTEXITCODE -ne 0) { throw 'FidelityFX SDK fetch failed.' }
          git -C $dir checkout -q FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'FidelityFX SDK checkout failed.' }
      - name: Generate FSR Vulkan shaders
        if: steps.fsr-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          python tools/fsr/generate_shaders.py --sdk out/deps/fidelityfx-sdk --output out/fsr-shaders-vk --threads %NUMBER_OF_PROCESSORS% || exit /b 1
          python tools/fsr/prepare_adapter_shaders.py --glslang out/deps/fidelityfx-sdk/sdk/tools/binary_store/glslangValidator.exe --output out/fsr-shaders-vk || exit /b 1
      - name: Generate FSR D3D12 shaders
        if: steps.fsr-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git submodule update --init --recursive tools/XenosRecomp || exit /b 1
          python tools/fsr/generate_dx12_shaders.py --sdk out/deps/fidelityfx-sdk --dxc-dir tools/XenosRecomp/thirdparty/dxc-bin/bin/x64 --output out/fsr-shaders-dx12 --threads %NUMBER_OF_PROCESSORS% || exit /b 1
          python tools/fsr/prepare_adapter_shaders_dx12.py --dxc tools/XenosRecomp/thirdparty/dxc-bin/bin/x64/dxc.exe --output out/fsr-adapter-dx12 || exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: fsr-vulkan-build-inputs
          path: |
            out/deps/fidelityfx-sdk/sdk
            out/deps/fidelityfx-sdk/ffx-api/include
            out/deps/fidelityfx-sdk/PrebuiltSignedDLL/amd_fidelityfx_dx12.dll
            out/deps/fidelityfx-sdk/LICENSE.txt
            out/fsr-shaders-vk
            out/fsr-shaders-dx12
            out/fsr-adapter-dx12
          if-no-files-found: error

  release-windows:
    name: Windows Release
    needs: [create-draft-release, prepare-fsr]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9][0-9A-Za-z.+-]*$') { throw 'Expected a version tag starting with v.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive
      - uses: actions/download-artifact@v4
        with:
          name: fsr-vulkan-build-inputs
          path: out
      - name: Install packaging tools
        run: |
          python -m venv out/venv
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed.' }
          Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path out/venv/Scripts).Path
          out/venv/Scripts/python -m pip install -r tools/release/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed.' }
      - name: Retrieve private build inputs
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Cache pinned NVIDIA DLSS SDK
        uses: actions/cache@v4
        with:
          path: out/deps/nvidia-dlss
          key: ${{ runner.os }}-dlss-374959484e79a640feaba44c93ac8cfb0a03f5b5-${{ hashFiles('tools/release/fetch_dlss_sdk.py') }}
      - name: Fetch NVIDIA DLSS SDK
        run: python tools/release/fetch_dlss_sdk.py --dest out/deps/nvidia-dlss
      - name: Cache pinned NVIDIA Streamline archive
        uses: actions/cache@v4
        with:
          path: out/deps/streamline-sdk-v2.14.1.zip
          key: Windows-streamline-v2.14.1-${{ hashFiles('tools/release/prepare_streamline_sdk.py') }}
      - name: Fetch pinned NVIDIA Streamline SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'streamline-sdk-v2.14.1.zip'
          New-Item -ItemType Directory -Force out/deps | Out-Null
          if (-not (Test-Path -LiteralPath out/deps/$zip)) {
            gh release download v2.14.1 --repo NVIDIA-RTX/Streamline --pattern $zip --dir out/deps
            if ($LASTEXITCODE -ne 0) { throw 'Official Streamline SDK download failed.' }
          }
          python tools/release/prepare_streamline_sdk.py --archive out/deps/$zip --dest out/deps/streamline
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Streamline SDK verification failed.' }
      - name: Cache pinned Intel XeSS archive
        uses: actions/cache@v4
        with:
          path: out/deps/XeSS_SDK_3.0.2.zip
          key: Windows-xess-v3.0.2-${{ hashFiles('tools/release/prepare_xess_sdk.py') }}
      - name: Fetch pinned Intel XeSS SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'XeSS_SDK_3.0.2.zip'
          New-Item -ItemType Directory -Force out/deps | Out-Null
          if (-not (Test-Path -LiteralPath out/deps/$zip)) {
            gh release download v3.0.2 --repo intel/xess --pattern $zip --dir out/deps
            if ($LASTEXITCODE -ne 0) { throw 'Official XeSS SDK download failed.' }
          }
          python tools/release/prepare_xess_sdk.py --archive out/deps/$zip --dest out/deps/xess
          if ($LASTEXITCODE -ne 0) { throw 'Pinned XeSS SDK verification failed.' }
      - name: Generate game code
        shell: cmd
        run: |
          call tools\build_tools.bat || exit /b 1
          out\build\tools\xexdump.exe LostOdysseyRecompLib\private\disc1\default.xex LostOdysseyRecompLib\private\image_disc1.bin || exit /b 1
          python tools\ppc_codegen.py generate || exit /b 1
      - name: Build Release
        shell: cmd
        env:
          LO_BUILD_JOBS: '4'
          LO_ENABLE_DLSS: 'ON'
          LO_REQUIRE_DLSS: 'ON'
          LO_DLSS_SDK_ROOT: out\deps\nvidia-dlss
          LO_ENABLE_STREAMLINE_FG: 'ON'
          LO_ENABLE_D3D12_DLSS_FG: 'ON'
          LO_ENABLE_FSR_FG: 'ON'
          LO_STREAMLINE_SDK_ROOT: ${{ github.workspace }}/out/deps/streamline
          LO_FSR_FG_RUNTIME: ${{ github.workspace }}/out/deps/fidelityfx-sdk/PrebuiltSignedDLL/amd_fidelityfx_dx12.dll
          LO_ENABLE_FSR: 'ON'
          LO_REQUIRE_FSR: 'ON'
          LO_FSR_SDK_ROOT: ${{ github.workspace }}/out/deps/fidelityfx-sdk
          LO_FSR_SHADER_DIR: ${{ github.workspace }}/out/fsr-shaders-vk
          LO_FSR_DX12_SHADER_DIR: ${{ github.workspace }}/out/fsr-shaders-dx12
          LO_FSR_DX12_ADAPTER_DIR: ${{ github.workspace }}/out/fsr-adapter-dx12
          LO_ENABLE_XESS: 'ON'
          LO_ENABLE_XESS_FG: 'ON'
          LO_XESS_SDK_ROOT: ${{ github.workspace }}/out/deps/xess
        run: call tools\build_release.bat
      - name: Stage FG runtime dependencies
        run: |
          $runtime = 'out/build/release/LostOdysseyRecomp'
          Copy-Item -LiteralPath out/deps/streamline/bin/x64/NvLowLatencyVk.dll -Destination $runtime
          foreach ($dll in @('sl.interposer.dll', 'sl.common.dll', 'sl.dlss_g.dll', 'sl.reflex.dll', 'sl.pcl.dll', 'nvngx_dlssg.dll', 'NvLowLatencyVk.dll', 'amd_fidelityfx_dx12.dll', 'libxess.dll', 'libxess_fg.dll', 'libxell.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $dll) -PathType Leaf)) { throw "FG runtime missing after build: $dll" }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $install) { throw 'Visual Studio installation not found.' }
          $redist = Get-ChildItem -LiteralPath (Join-Path $install 'VC/Redist/MSVC') -Directory |
            Where-Object { $_.Name -match '^[0-9]' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'x64/Microsoft.VC143.CRT/msvcp140.dll')) } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $redist) { throw 'Official x64 VC143 redistributable files not found.' }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $source = Join-Path $redist.FullName "x64/Microsoft.VC143.CRT/$dll"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "VC143 redistributable file missing: $dll" }
            Copy-Item -LiteralPath $source -Destination $runtime
          }
      - name: Package runtime
        run: |
          if (-not (Test-Path -LiteralPath out/build/release/LostOdysseyRecomp/licenses/LICENSE-FidelityFX.txt -PathType Leaf)) {
            throw 'FSR license was not staged by the Windows runtime build.'
          }
          if ($env:RELEASE_TAG) {
            python tools/package_release.py --version $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
          } else {
            python tools/package_release.py
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-windows-x64
          path: out/releases/LostOdysseyRecomp-*.zip
          if-no-files-found: error

  release-linux:
    name: Linux Release
    # The reuse check must be able to see the tag's draft release.
    permissions:
      contents: write
    needs: [create-draft-release, prepare-fsr]
    # Build the runtime AND all bundled dependencies against glibc 2.35.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CCACHE_DIR: ${{ github.workspace }}/out/ccache-linux
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: '1'
      CCACHE_MAXSIZE: 3G
      FLATPAK_OUTPUT: ${{ github.workspace }}/out/flatpak/ci-${{ github.run_id }}
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Expected a version tag starting with v." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fsr-vulkan-build-inputs
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline-compatible C++23 toolchain
        run: bash tools/release/install_appimage_toolchain.sh
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libcurl4-openssl-dev \
            libvulkan-dev \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libxtst-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libdecor-0-dev \
            libdbus-1-dev \
            libudev-dev \
            file \
            wget \
            ccache
          # Jammy's distribution CMake predates the project's 3.28 minimum.
          python -m pip install 'cmake==3.31.6' -r tools/release/requirements.txt
          python -m unittest discover -s tools/tests -p test_appimage_compat.py
      - name: Cache Linux compiler objects
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: Linux-ccache-clang18-v1-${{ hashFiles('tools/release/install_appimage_toolchain.sh', 'CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            Linux-ccache-clang18-v1-${{ hashFiles('tools/release/install_appimage_toolchain.sh', 'CMakeLists.txt', '.gitmodules') }}-
            Linux-ccache-clang18-v1-
      - name: Configure compiler cache
        run: |
          {
            echo "CMAKE_C_COMPILER_LAUNCHER=$(command -v ccache)"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=$(command -v ccache)"
          } >> "$GITHUB_ENV"
          ccache --zero-stats
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-sdl3.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Cache pinned NVIDIA DLSS SDK
        uses: actions/cache@v4
        with:
          path: out/deps/nvidia-dlss
          key: ${{ runner.os }}-dlss-374959484e79a640feaba44c93ac8cfb0a03f5b5-${{ hashFiles('tools/release/fetch_dlss_sdk.py') }}
      - name: Fetch NVIDIA DLSS SDK
        run: python3 tools/release/fetch_dlss_sdk.py --dest out/deps/nvidia-dlss
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build Linux runtime
        run: |
          cmake -S . -B out/build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLO_ENABLE_DLSS=ON \
            -DLO_REQUIRE_DLSS=ON \
            -DLO_DLSS_SDK_ROOT="$GITHUB_WORKSPACE/out/deps/nvidia-dlss" \
            -DLO_ENABLE_FSR=ON \
            -DLO_REQUIRE_FSR=ON \
            -DLO_FSR_SDK_ROOT="$GITHUB_WORKSPACE/out/deps/fidelityfx-sdk" \
            -DLO_FSR_SHADER_DIR="$GITHUB_WORKSPACE/out/fsr-shaders-vk" \
            -DSDL_PIPEWIRE=ON -DSDL_PIPEWIRE_SHARED=ON
          grep -q '^#define SDL_AUDIO_DRIVER_PIPEWIRE 1' out/build/linux/thirdparty/SDL/include-config-release/build_config/SDL_build_config.h
          grep -q '^#define SDL_AUDIO_DRIVER_PIPEWIRE_DYNAMIC ' out/build/linux/thirdparty/SDL/include-config-release/build_config/SDL_build_config.h
          cmake --build out/build/linux --target LostOdysseyRecomp --parallel "$(nproc)"
      # Packages carry no shader pack: the game downloads the one for its
      # renderer from the shader-packs prerelease. A version needs packs for
      # all three contracts of its runtime published first.
      - name: Check published shader packs
        run: |
          cmake --build out/build/linux --target LoShaderPackTool --parallel "$(nproc)"
          tool=$(find out/build/linux -name LoShaderPackTool -type f | head -n 1)
          if ! python3 tools/release/publish_shader_packs.py --check --tool "$tool" --image LostOdysseyRecompLib/private/image_disc1.bin; then
            if [ -n "$RELEASE_TAG" ]; then exit 1; fi
            echo "::warning::No published shader packs for this runtime; a version release would stop here."
          fi
      - name: Compiler cache statistics
        if: always() && env.CMAKE_CXX_COMPILER_LAUNCHER != ''
        run: ccache --show-stats || true
      - name: Install linuxdeploy
        run: |
          mkdir -p out/tools/linuxdeploy
          wget -q -O out/tools/linuxdeploy/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x out/tools/linuxdeploy/linuxdeploy
          echo "$GITHUB_WORKSPACE/out/tools/linuxdeploy" >> "$GITHUB_PATH"
      - name: Build pinned AppImage runtime with automatic FUSE fallback
        run: bash tools/release/build_appimage_runtime.sh
      - name: Test AppImage runtime without FUSE
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          # A private mount namespace hides the device only for this fixture.
          sudo unshare --mount --propagation private bash -c '
            if [ -e /dev/fuse ]; then mount --bind /dev/null /dev/fuse; fi
            python3 tools/tests/appimage_runtime_test.py --runtime out/tools/appimage-runtime/runtime-x86_64 --mode no-fuse
          '
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [ ! -f out/build/linux/LostOdysseyRecomp/licenses/LICENSE-FidelityFX.txt ]; then
            echo 'FSR license was not staged by the Linux runtime build.' >&2
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            python tools/package_appimage.py --build out/build/linux --output out/releases --appdir out/releases/linux.AppDir --version "$RELEASE_TAG" --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          else
            python tools/package_appimage.py --build out/build/linux --output out/releases --appdir out/releases/linux.AppDir --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-linux-x64
          path: out/releases/LostOdysseyRecomp-*.AppImage
          if-no-files-found: error
      - name: Reuse published Flatpak asset when available
        id: flatpak-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -Fxq -- "LostOdysseyRecomp-linux-x64-${RELEASE_TAG}.flatpak"; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo "Reusing the published Flatpak asset for $RELEASE_TAG."
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Install Flatpak packaging tools and runtime
        if: steps.flatpak-release.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          sudo flatpak --system remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak --system install -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08
      - name: Package Flatpak from the AppImage runtime
        if: steps.flatpak-release.outputs.build == 'true'
        run: |
          args=(--appdir out/releases/linux.AppDir --output "$FLATPAK_OUTPUT")
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--version "$RELEASE_TAG")
          fi
          python3 tools/package_flatpak.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.flatpak-release.outputs.build == 'true'
        with:
          name: LostOdysseyRecomp-linux-x64-flatpak
          path: |
            ${{ env.FLATPAK_OUTPUT }}/*.flatpak
            ${{ env.FLATPAK_OUTPUT }}/source.json
          if-no-files-found: error

  release-macos:
    name: macOS Release
    needs: [create-draft-release]
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CCACHE_DIR: ${{ github.workspace }}/out/ccache-macos
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: '1'
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Expected a version tag starting with v." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install ninja ccache
          python -m pip install numpy pillow
      - name: Resolve toolchain and SDL cache identity
        id: macos-inputs
        run: |
          {
            xcrun clang --version
            xcrun --show-sdk-version
            cmake --version
            ninja --version
            ccache --version
          } > "$RUNNER_TEMP/macos-toolchain.txt"
          cat "$RUNNER_TEMP/macos-toolchain.txt"
          echo "toolchain=$(shasum -a 256 "$RUNNER_TEMP/macos-toolchain.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          sdl=$(git rev-parse HEAD:thirdparty/SDL)
          # Match the SDL3 release configuration used for the M1 Max DMGs.
          test "$sdl" = 829a65d769d935c4852f8159e964312c0957260a
          echo "sdl=$sdl" >> "$GITHUB_OUTPUT"
      - name: Cache SDL build
        id: macos-sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/build/macos/thirdparty/SDL
            out/build/macos/.ninja_log
            out/build/macos/.ninja_deps
          key: macOS-sdl3-arm64-min15-v1-${{ steps.macos-inputs.outputs.sdl }}-${{ steps.macos-inputs.outputs.toolchain }}-${{ hashFiles('CMakeLists.txt', 'thirdparty/CMakeLists.txt', 'tools/patches/plume-*.patch') }}
      - name: Cache macOS compiler objects
        id: macos-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macOS-ccache-arm64-min15-v1-${{ steps.macos-inputs.outputs.toolchain }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.gitmodules', 'tools/patches/**') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            macOS-ccache-arm64-min15-v1-${{ steps.macos-inputs.outputs.toolchain }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.gitmodules', 'tools/patches/**') }}-
            macOS-ccache-arm64-min15-v1-${{ steps.macos-inputs.outputs.toolchain }}-
      - name: Configure compiler cache
        run: |
          {
            echo "CMAKE_C_COMPILER_LAUNCHER=$(command -v ccache)"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=$(command -v ccache)"
          } >> "$GITHUB_ENV"
          ccache --zero-stats
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-sdl3.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-macos.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-macos.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build macOS runtime and shader pack tool
        run: |
          cmake -S . -B out/build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build out/build/macos --target LostOdysseyRecomp LoShaderPackTool
      # Retain successful build outputs even if a later package check fails.
      - name: Save SDL build cache
        if: steps.macos-sdl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/build/macos/thirdparty/SDL
            out/build/macos/.ninja_log
            out/build/macos/.ninja_deps
          key: ${{ steps.macos-sdl-cache.outputs.cache-primary-key }}
      - name: Save macOS compiler cache
        if: steps.macos-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.macos-ccache.outputs.cache-primary-key }}
      - name: Check shader pack coverage for this runtime
        run: |
          tool=$(find out/build/macos -name LoShaderPackTool -type f | head -n 1)
          python tools/release/publish_shader_packs.py --check --tool "$tool" --image LostOdysseyRecompLib/private/image_disc1.bin
      - name: Package macOS disk image
        run: |
          args=(--build out/build/macos --output out/releases --dmg)
          if [ -n "$RELEASE_TAG" ]; then args+=(--version "$RELEASE_TAG"); fi
          python tools/package_macos.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-macos-arm64
          path: out/releases/LostOdysseyRecomp-macos-arm64-*.dmg
          if-no-files-found: error
      - name: Verify DMG, minimum OS and no-data load
        run: |
          images=(out/releases/*.dmg)
          test "${#images[@]}" -eq 1
          args=(--dmg "${images[0]}" --expected-version "$(cat out/build/macos/LostOdysseyRecomp/source-version.txt)" --output out/macos-validation)
          python tools/release/verify_macos_package.py "${args[@]}"
      - name: Compiler cache statistics
        if: always() && env.CMAKE_CXX_COMPILER_LAUNCHER != ''
        run: ccache --show-stats || true
      - name: Upload macOS validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-validation
          path: out/macos-validation
          if-no-files-found: ignore

  release-android:
    name: Android Release
    needs: [create-draft-release]
    # Same code generation and debug signing as android-apk.yml.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      LO_BUILD_JOBS: '4'
      CCACHE_MAXSIZE: 2G
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - name: Set Android cache directory
        run: echo "LO_ANDROID_CI_CACHE=$RUNNER_TEMP/lo-android-ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host toolchain for the recompiler tools
        run: bash tools/release/install_appimage_toolchain.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build file unzip wget ccache openjdk-17-jdk-headless
          python -m pip install 'cmake==3.31.6'
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/android-sdk
          key: android-sdk-${{ runner.os }}-cmdline11076708-api35-build35-ndk28.2.13676358-cmake3.22.1-v1
      - name: Cache Android DXC
        uses: actions/cache@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/android-dxc
          key: android-dxc-${{ runner.os }}-ndk28.2.13676358-${{ hashFiles('tools/android/build-dxc.sh', 'tools/android/ci_build.sh') }}
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LO_ANDROID_CI_CACHE }}/gradle/caches
            ${{ env.LO_ANDROID_CI_CACHE }}/gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('packaging/android/**/*.gradle', 'packaging/android/**/*.gradle.kts', 'packaging/android/gradle.properties', 'packaging/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Cache Android compiler objects
        uses: actions/cache@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/ccache
          key: android-ccache-${{ runner.os }}-ndk28.2.13676358-${{ hashFiles('tools/android/*.sh', 'CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            android-ccache-${{ runner.os }}-ndk28.2.13676358-${{ hashFiles('tools/android/*.sh', 'CMakeLists.txt', 'cmake/**') }}-
            android-ccache-${{ runner.os }}-ndk28.2.13676358-
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 2ba529b72c68ae2ee01903d24f7eac55cbb900df
          path: out/build-input
          sparse-checkout: |
            /default.xex
            /android/libdxcompiler.so
            /android/debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build the APK
        run: bash tools/android/ci_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-android-arm64
          path: out/apk/*.apk
          if-no-files-found: error

  # The build jobs only produce run artifacts. Writing to the GitHub release
  # happens here, after all platforms have built. The release environment
  # accepts only v* tags and waits for the maintainer's approval.
  publish-release:
    name: Publish complete release
    environment: release
    permissions:
      contents: write
      actions: write
    needs: [release-windows, release-linux, release-android, release-macos]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download installable packages
        uses: actions/download-artifact@v4
        with:
          pattern: LostOdysseyRecomp-*
          path: dist
          merge-multiple: true
      - name: Upload installable packages to the release
        run: |
          set -euo pipefail
          packages=(
            "dist/LostOdysseyRecomp-windows-x64-${RELEASE_TAG}.zip"
            "dist/LostOdysseyRecomp-linux-x64-${RELEASE_TAG}.AppImage"
            "dist/LostOdysseyRecomp-linux-x64-${RELEASE_TAG}.flatpak"
            "dist/LostOdysseyRecomp-android-arm64-${RELEASE_TAG}.apk"
            "dist/LostOdysseyRecomp-macos-arm64-${RELEASE_TAG}.dmg"
          )
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          missing=()
          for file in "${packages[@]}"; do
            name=$(basename "$file")
            if grep -Fxq -- "$name" <<< "$existing"; then
              echo "$name is already on the release; preserving the reviewed asset."
            elif [ -f "$file" ]; then
              missing+=("$file")
            else
              echo "$name is neither on the release nor among the run's artifacts." >&2
              exit 1
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            ls -l "${missing[@]}"
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
      - name: Verify package set and publish draft
        id: publish
        run: |
          gh release view "$RELEASE_TAG" --json assets,isDraft > release.json
          python3 - <<'PY'
          import json, os
          tag = os.environ['RELEASE_TAG']
          assets = json.load(open('release.json'))['assets']
          expected = {
              f'LostOdysseyRecomp-windows-x64-{tag}.zip',
              f'LostOdysseyRecomp-linux-x64-{tag}.AppImage',
              f'LostOdysseyRecomp-linux-x64-{tag}.flatpak',
              f'LostOdysseyRecomp-android-arm64-{tag}.apk',
              f'LostOdysseyRecomp-macos-arm64-{tag}.dmg',
          }
          names = {asset['name'] for asset in assets}
          assert names == expected and len(assets) == len(expected), 'Expected exactly five installable packages; shader packs live on the shader-packs release'
          assert all(asset['size'] > 0 and asset['state'] == 'uploaded' for asset in assets), 'Incomplete release upload'
          PY
          if [ "$(jq -r '.isDraft' release.json)" != true ]; then
            echo 'Release is already public; preserving its publication state.'
            exit 0
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo 'published=true' >> "$GITHUB_OUTPUT"
      # Publishing with GITHUB_TOKEN does not emit release:published workflows.
      - name: Announce published release on Discord
        if: steps.publish.outputs.published == 'true'
        run: gh workflow run discord-notify.yml -f release_tag="$RELEASE_TAG" -f dry_run=false
