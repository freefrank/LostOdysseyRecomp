name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to package; empty builds the selected ref'
        type: string
        required: false

  push:
    tags: ['v*']

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

permissions:
  contents: read

jobs:
  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Create draft release if missing
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; not recreating."
            exit 0
          fi
          mkdir -p out/releases
          python3 tools/release/extract_release_notes.py --changelog CHANGELOG.md --version "$RELEASE_TAG" --output out/releases/release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file out/releases/release-notes.md

  prepare-fsr:
    name: Prepare FSR Vulkan build inputs
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned FidelityFX SDK
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: c6efa6bf7f2027b3ec94f28578bb5965eabb9e55
          path: out/deps/fidelityfx-sdk
          sparse-checkout: |
            /LICENSE.txt
            /sdk/include/
            /sdk/src/shared/
            /sdk/src/components/fsr3upscaler/
            /sdk/src/backends/shared/
            /sdk/src/backends/vk/
            /sdk/tools/binary_store/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Generate FSR Vulkan shaders
        shell: cmd
        run: |
          python tools/fsr/generate_shaders.py --sdk out/deps/fidelityfx-sdk --output out/fsr-shaders-vk --threads 2 || exit /b 1
          python tools/fsr/prepare_adapter_shaders.py --glslang out/deps/fidelityfx-sdk/sdk/tools/binary_store/glslangValidator.exe --output out/fsr-shaders-vk || exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: fsr-vulkan-build-inputs
          path: |
            out/deps/fidelityfx-sdk/sdk
            out/deps/fidelityfx-sdk/LICENSE.txt
            out/fsr-shaders-vk
          if-no-files-found: error
          include-hidden-files: true

  release-windows:
    name: Windows Release
    needs: [create-draft-release, prepare-fsr]
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9][0-9A-Za-z.+-]*$') { throw 'Expected a version tag starting with v.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fsr-vulkan-build-inputs
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install -r tools/release/requirements.txt
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Retrieve pinned portable shader pack input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 2695699896a956af7206fcabdbe9de319aa4b955
          path: out/shader-input
          sparse-checkout: |
            shaders/
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Fetch NVIDIA DLSS SDK
        run: python tools/release/fetch_dlss_sdk.py --dest out/deps/nvidia-dlss
      - name: Generate game code
        shell: cmd
        run: |
          call tools\build_tools.bat || exit /b 1
          out\build\tools\xexdump.exe LostOdysseyRecompLib\private\disc1\default.xex LostOdysseyRecompLib\private\image_disc1.bin || exit /b 1
          python tools\ppc_codegen.py generate || exit /b 1
      - name: Build Release
        shell: cmd
        env:
          LO_BUILD_JOBS: '2'
          LO_ENABLE_DLSS: 'ON'
          LO_REQUIRE_DLSS: 'ON'
          LO_DLSS_SDK_ROOT: out\deps\nvidia-dlss
          LO_ENABLE_FSR: 'ON'
          LO_REQUIRE_FSR: 'ON'
          LO_FSR_SDK_ROOT: ${{ github.workspace }}/out/deps/fidelityfx-sdk
          LO_FSR_SHADER_DIR: ${{ github.workspace }}/out/fsr-shaders-vk
        run: call tools\build_release.bat
      - name: Fetch portable shader pack
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          # The pinned input takes priority over a previously staged valid pack.
          Remove-Item -LiteralPath out/build/release/LostOdysseyRecomp/shaders/portable_vk.lospv -ErrorAction SilentlyContinue
          python tools/release/fetch_shader_pack.py --target-dir out/build/release/LostOdysseyRecomp/shaders --pack-tool out/build/release/LostOdysseyRecomp/LoShaderPackTool.exe --tag "$env:RELEASE_TAG"
      - name: Confirm pinned portable shader pack
        run: |
          $expected = 'b486c87d121968bcec67fae6bc1aa7926378455281bc8b2a221409b8c06c6e2b'
          $manifest = Get-Content out/shader-input/shaders/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.sha256 -ne $expected -or $manifest.records -ne 28527) { throw 'Private shader pack input has an unexpected identity.' }
          $actual = (Get-FileHash out/build/release/LostOdysseyRecomp/shaders/portable_vk.lospv -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Release shader pack differs from the pinned 28527-record input.' }
      - name: Package runtime
        run: |
          if (-not (Test-Path -LiteralPath out/build/release/LostOdysseyRecomp/licenses/LICENSE-FidelityFX.txt -PathType Leaf)) {
            throw 'FSR license was not staged by the Windows runtime build.'
          }
          if ($env:RELEASE_TAG) {
            python tools/package_release.py --version $env:RELEASE_TAG
          } else {
            python tools/package_release.py
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-windows-x64
          path: |
            out/releases/LostOdysseyRecomp-*.zip
            out/releases/LostOdysseyRecomp-*.sha256
          if-no-files-found: error
      - name: Upload Windows assets to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem out/releases/LostOdysseyRecomp-*.zip,out/releases/LostOdysseyRecomp-*.sha256 | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw 'No Windows release assets to upload.' }
          $json = gh release view $env:RELEASE_TAG --json assets
          if ($LASTEXITCODE -ne 0) { throw 'Release is missing.' }
          $release = $json | ConvertFrom-Json
          $existing = @($release.assets | ForEach-Object { $_.name })
          $missing = @($assets | Where-Object { $existing -notcontains [IO.Path]::GetFileName($_) })
          if ($missing.Count -eq 0) {
            Write-Host 'Windows assets already on the release; preserving its reviewed assets.'
            exit 0
          }
          gh release upload $env:RELEASE_TAG @missing
          if ($LASTEXITCODE -ne 0) { throw 'Windows release asset upload failed.' }

  release-linux:
    name: Linux Release
    needs: [create-draft-release, prepare-fsr]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FLATPAK_OUTPUT: ${{ github.workspace }}/out/flatpak/ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate requested tag
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Expected a version tag starting with v." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fsr-vulkan-build-inputs
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            lld \
            ninja-build \
            cmake \
            libcurl4-openssl-dev \
            libvulkan-dev \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libdecor-0-dev \
            libdbus-1-dev \
            libudev-dev \
            file \
            wget
          python -m pip install -r tools/release/requirements.txt
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: |
            /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Retrieve pinned portable shader pack input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 2695699896a956af7206fcabdbe9de319aa4b955
          path: out/shader-input
          sparse-checkout: |
            shaders/
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
          python tools/ppc_codegen.py stamp-tool --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Fetch NVIDIA DLSS SDK
        run: python3 tools/release/fetch_dlss_sdk.py --dest out/deps/nvidia-dlss
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build Linux runtime
        run: |
          cmake -S . -B out/build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLO_ENABLE_DLSS=ON \
            -DLO_REQUIRE_DLSS=ON \
            -DLO_DLSS_SDK_ROOT="$GITHUB_WORKSPACE/out/deps/nvidia-dlss" \
            -DLO_ENABLE_FSR=ON \
            -DLO_REQUIRE_FSR=ON \
            -DLO_FSR_SDK_ROOT="$GITHUB_WORKSPACE/out/deps/fidelityfx-sdk" \
            -DLO_FSR_SHADER_DIR="$GITHUB_WORKSPACE/out/fsr-shaders-vk"
          cmake --build out/build/linux --target LostOdysseyRecomp LoShaderPackTool --parallel 2
      - name: Install linuxdeploy
        run: |
          mkdir -p out/tools/linuxdeploy
          wget -q -O out/tools/linuxdeploy/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x out/tools/linuxdeploy/linuxdeploy
          echo "$GITHUB_WORKSPACE/out/tools/linuxdeploy" >> "$GITHUB_PATH"
      - name: Fetch portable shader pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f out/build/linux/shaders/portable_vk.lospv
          python tools/release/fetch_shader_pack.py --target-dir out/build/linux/shaders --pack-tool out/build/linux/LostOdysseyRecomp/LoShaderPackTool --tag "$RELEASE_TAG"
      - name: Confirm pinned portable shader pack
        run: |
          python3 -c 'import json; m=json.load(open("out/shader-input/shaders/manifest.json")); assert (m["sha256"],m["records"]) == ("b486c87d121968bcec67fae6bc1aa7926378455281bc8b2a221409b8c06c6e2b",28527), "Private shader pack input has an unexpected identity"'
          printf '%s  %s\n' 'b486c87d121968bcec67fae6bc1aa7926378455281bc8b2a221409b8c06c6e2b' 'out/build/linux/shaders/portable_vk.lospv' | sha256sum --check
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [ ! -f out/build/linux/LostOdysseyRecomp/licenses/LICENSE-FidelityFX.txt ]; then
            echo 'FSR license was not staged by the Linux runtime build.' >&2
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            python tools/package_appimage.py --build out/build/linux --output out/releases --version "$RELEASE_TAG" --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          else
            python tools/package_appimage.py --build out/build/linux --output out/releases --linuxdeploy out/tools/linuxdeploy/linuxdeploy
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-linux-x64
          path: |
            out/releases/LostOdysseyRecomp-*.AppImage
            out/releases/LostOdysseyRecomp-*.AppImage.sha256
          if-no-files-found: error
      - name: Upload Linux assets to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          linux_assets=()
          for file in out/releases/LostOdysseyRecomp-*.AppImage out/releases/LostOdysseyRecomp-*.AppImage.sha256; do
            if [ -f "$file" ]; then
              linux_assets+=("$file")
            fi
          done
          if [ ${#linux_assets[@]} -eq 0 ]; then
            echo "No Linux release assets to upload." >&2
            exit 1
          fi
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          missing=()
          for file in "${linux_assets[@]}"; do
            if ! grep -Fxq -- "$(basename "$file")" <<< "$existing"; then
              missing+=("$file")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Linux assets already on the release; preserving its reviewed assets."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${missing[@]}"
      - name: Reuse published Flatpak asset when available
        id: flatpak-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -Fxq -- "LostOdysseyRecomp-linux-x64-${RELEASE_TAG}.flatpak"; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo "Reusing the published Flatpak asset for $RELEASE_TAG."
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Checkout pinned FFmpeg source for Flatpak
        if: steps.flatpak-release.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: xenia-project/FFmpeg
          ref: 15ece0882e8d5875051ff5b73c5a8326f7cee9f5
          path: out/deps/ffmpeg-flatpak
          submodules: recursive
          persist-credentials: false
      - name: Checkout pinned Zstd source for Flatpak
        if: steps.flatpak-release.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: facebook/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99
          path: out/deps/zstd-flatpak
          submodules: recursive
          persist-credentials: false
      - name: Install Flatpak build tools and selected runtime
        if: steps.flatpak-release.outputs.build == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          sudo flatpak --system remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak --system install -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.llvm22//26.08
          printf 'Host tools and installed Flatpak refs:\n'
          flatpak --version
          flatpak-builder --version
          cmake --version
          python3 --version
          sudo flatpak --system info --show-ref org.freedesktop.Platform//26.08
          sudo flatpak --system info --show-ref org.freedesktop.Sdk//26.08
          sudo flatpak --system info --show-ref org.freedesktop.Sdk.Extension.llvm22//26.08
          sudo flatpak --system info --show-commit org.freedesktop.Platform//26.08
          sudo flatpak --system info --show-commit org.freedesktop.Sdk//26.08
          sudo flatpak --system info --show-commit org.freedesktop.Sdk.Extension.llvm22//26.08
      - name: Build private-input Flatpak from pinned sources
        if: steps.flatpak-release.outputs.build == 'true'
        run: |
          set -euo pipefail
          python3 -B tools/package_flatpak.py \
            --source "$GITHUB_WORKSPACE" \
            --output "$FLATPAK_OUTPUT" \
            --ppc "$GITHUB_WORKSPACE/LostOdysseyRecompLib/ppc" \
            --codegen-manifest "$GITHUB_WORKSPACE/LostOdysseyRecompLib/ppc/codegen-manifest.json" \
            --default-xex "$GITHUB_WORKSPACE/LostOdysseyRecompLib/private/disc1/default.xex" \
            --image-disc1 "$GITHUB_WORKSPACE/LostOdysseyRecompLib/private/image_disc1.bin" \
            --image-sym "$GITHUB_WORKSPACE/LostOdysseyRecompLib/private/image_disc1.bin.sym" \
            --ngx-sdk "$GITHUB_WORKSPACE/out/deps/nvidia-dlss" \
            --fsr-sdk "$GITHUB_WORKSPACE/out/deps/fidelityfx-sdk" \
            --fsr-shaders "$GITHUB_WORKSPACE/out/fsr-shaders-vk" \
            --shader-pack "$GITHUB_WORKSPACE/out/build/linux/shaders/portable_vk.lospv" \
            --ffmpeg-source "$GITHUB_WORKSPACE/out/deps/ffmpeg-flatpak" \
            --zstd-source "$GITHUB_WORKSPACE/out/deps/zstd-flatpak"
          shopt -s nullglob
          bundles=("$FLATPAK_OUTPUT"/*.flatpak)
          test "${#bundles[@]}" -eq 1
          test -s "$FLATPAK_OUTPUT/source.json"
          (cd "$FLATPAK_OUTPUT" && sha256sum --check "$(basename "${bundles[0]}").sha256")
          flatpak-builder --run "$FLATPAK_OUTPUT/builder" "$FLATPAK_OUTPUT/build-manifest.json" sh -eu -c '
            for tool in /usr/lib/sdk/llvm22/bin/clang++ /usr/bin/cmake /usr/bin/python3 /usr/bin/ninja; do
              test -x "$tool"
              "$tool" --version
            done
          '
      - name: Install and inspect Flatpak in temporary user installation
        if: steps.flatpak-release.outputs.build == 'true'
        run: |
          set -euo pipefail
          check_home=$(mktemp -d "$RUNNER_TEMP/lo-flatpak-user.XXXXXX")
          trap 'rm -rf "$check_home"' EXIT
          export HOME="$check_home"
          export XDG_DATA_HOME="$check_home/.local/share"
          export XDG_CONFIG_HOME="$check_home/.config"
          export XDG_CACHE_HOME="$check_home/.cache"
          export XDG_STATE_HOME="$check_home/.local/state"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          shopt -s nullglob
          bundles=("$FLATPAK_OUTPUT"/*.flatpak)
          test "${#bundles[@]}" -eq 1
          flatpak --user install -y --noninteractive --no-deps --no-related "${bundles[0]}"
          app_ref=io.github.freefrank.LostOdysseyRecomp//dev
          test "$(flatpak --user info --show-ref "$app_ref")" = 'app/io.github.freefrank.LostOdysseyRecomp/x86_64/dev'
          test "$(flatpak --user info --show-runtime "$app_ref")" = 'org.freedesktop.Platform/x86_64/26.08'
          # Launch only a shell in the installed app's sandbox, never the game.
          flatpak --user run --command=sh "$app_ref" -eu -c '
            test -f /app/bin/LostOdysseyRecomp
            test -f /app/lib/libdxcompiler.so
            test -f /app/bin/libnvidia-ngx-dlss.so.310.9.1
            for alias in libnvidia-ngx-dlss.so libnvidia-ngx-dlss.so.1; do
              test -L "/app/bin/$alias"
              test "$(readlink "/app/bin/$alias")" = libnvidia-ngx-dlss.so.310.9.1
            done
            test -s /app/bin/shaders/portable_vk.lospv
            test ! -e /app/bin/portable_vk.lospv
            test ! -e /app/LostOdysseyRecompLib/private/disc1/default.xex
            test ! -e /app/flatpak-inputs
            test -s /app/share/licenses/lost-odyssey-recomp/NVIDIA-DLSS/LICENSE.txt
            test -s /app/share/licenses/lost-odyssey-recomp/NVIDIA-DLSS/NOTICE.txt
            test -s /app/share/licenses/lost-odyssey-recomp/LICENSE-FidelityFX.txt
            test -s /app/share/licenses/lost-odyssey-recomp/zstd-LICENSE.txt
            command -v ldd
            for binary in /app/bin/LostOdysseyRecomp /app/lib/libdxcompiler.so /app/bin/libnvidia-ngx-dlss.so.310.9.1; do
              if deps=$(LC_ALL=C ldd -r "$binary" 2>&1); then
                printf "%s\n" "$deps"
              else
                status=$?
                printf "%s\n" "$deps" >&2
                echo "ldd -r failed for $binary (exit $status)" >&2
                exit "$status"
              fi
              if printf "%s\n" "$deps" | grep -Eiq "not found|undefined symbol|symbol lookup error"; then
                echo "Unresolved loader dependency or relocation in $binary" >&2
                exit 1
              fi
            done
            app_probe="/app/.lo-flatpak-install-check-$$"
            test ! -e "$app_probe"
            if ( : > "$app_probe" ) 2>/dev/null; then
              rm -f "$app_probe"
              echo "/app is writable" >&2
              exit 1
            fi
            XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
            test -n "${XDG_DATA_HOME:-}" && test -n "${XDG_CONFIG_HOME:-}"
            test "$XDG_DATA_HOME" != "$XDG_CONFIG_HOME"
            test "$XDG_DATA_HOME" != "$XDG_STATE_HOME"
            test "$XDG_CONFIG_HOME" != "$XDG_STATE_HOME"
            check_writable_dir() {
              dir="$1/lo-flatpak-install-check"
              mkdir -p "$dir"
              : > "$dir/write-check"
              test -w "$dir/write-check"
              rm "$dir/write-check"
              rmdir "$dir"
            }
            for dir in "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME"; do
              check_writable_dir "$dir"
            done
          '
      - uses: actions/upload-artifact@v4
        if: steps.flatpak-release.outputs.build == 'true'
        with:
          name: LostOdysseyRecomp-linux-x64-flatpak
          path: |
            ${{ env.FLATPAK_OUTPUT }}/*.flatpak
            ${{ env.FLATPAK_OUTPUT }}/*.flatpak.sha256
            ${{ env.FLATPAK_OUTPUT }}/source.json
          if-no-files-found: error
