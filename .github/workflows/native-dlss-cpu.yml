name: Native DLSS CPU contracts

on:
  push:
    branches: [dlss, FSR]
    paths:
      - LostOdysseyRecomp/gpu/**
      - tools/tests/**
      - tools/fsr/**
      - cmake/LoFsr*.cmake
      - tools/patches/plume-lostodyssey.patch
      - .github/workflows/native-dlss-cpu.yml
  pull_request:
    paths:
      - LostOdysseyRecomp/gpu/**
      - tools/tests/**
      - tools/fsr/**
      - cmake/LoFsr*.cmake
      - tools/patches/plume-lostodyssey.patch
      - .github/workflows/native-dlss-cpu.yml

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Preserve repository and submodule line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Xlib development headers for the Plume CPU interfaces
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libx11-dev
      - name: Initialize pinned Plume interface headers (no GPU library build)
        run: |
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
      - name: Initialize Plume Windows CMake source
        if: runner.os == 'Windows'
        run: git -C thirdparty/plume submodule update --init --depth 1 contrib/D3D12MemoryAllocator
      - name: Configure without Vulkan loader, vendor SDKs or game assets
        run: cmake -S tools/tests/native_dlss -B out/native-dlss-cpu -DLO_NATIVE_DLSS_CPU_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Configure GPU fixture registration without building or running it
        run: cmake -S tools/tests/native_dlss -B out/native-dlss-config -DLO_NATIVE_DLSS_CPU_ONLY=OFF -DBUILD_TESTING=ON -DPLUME_SDL_VULKAN_ENABLED=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Check GPU fixture CTest registration
        run: python -c "import json, subprocess; tests=json.loads(subprocess.check_output(['ctest', '--test-dir', 'out/native-dlss-config', '-C', 'Release', '--show-only=json-v1']))['tests']; names=[test['name'] for test in tests]; assert names.count('LoNativeDlssExecutionTest') == 1, names; print('GPU fixture registered once; no GPU test executed')"
      - name: Build CPU contract fixtures
        run: cmake --build out/native-dlss-cpu --config Release --target LoNativeDlssCpuTests --parallel 2
      - name: Run CPU contracts (not GPU or image-quality acceptance)
        run: ctest --test-dir out/native-dlss-cpu -C Release -L cpu --output-on-failure
