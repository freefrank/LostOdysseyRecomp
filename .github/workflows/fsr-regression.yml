name: FSR regression

on:
  push:
    branches: [FSR]
    paths:
      - '.github/workflows/fsr-regression.yml'
      - 'LostOdysseyRecomp/gpu/**'
      - 'tools/tests/**'
      - 'tools/fsr_repair_once.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: FSR projection and planner baseline
        run: |
          set -eu
          mkdir -p /tmp/fsr-tests
          g++ -std=c++20 -O2 -Wall -Wextra -I LostOdysseyRecomp tools/tests/fsr_projection_test.cpp -o /tmp/fsr-tests/projection
          /tmp/fsr-tests/projection
      - name: Source snapshot for offline review
        if: always()
        run: git bundle create /tmp/fsr-review.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsr-source-${{ github.sha }}
          path: /tmp/fsr-review.bundle
          retention-days: 1
          if-no-files-found: error
