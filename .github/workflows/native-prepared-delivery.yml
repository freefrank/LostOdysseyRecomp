name: Complete prepared-tail runtime delivery
on:
  push:
    branches: [fix/native-frontend-rework]
    paths:
      - .github/workflows/native-prepared-delivery.yml
      - .github/apply-prepared-tail.py
      - tools/tests/native_prepared_sdk_oracle.py
      - tools/tests/native_prepared_sdk_oracle.cpp
      - tools/tests/native_prepared_probe_test.py
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Preserve exact staged bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply interrupted source changes
        run: python .github/apply-prepared-tail.py
      - name: Probe contracts and configuration
        run: |
          python tools/tests/native_probe_log_test.py
          python tools/tests/native_prepared_probe_test.py
          python -m py_compile tools/perf/run_native_title.py tools/perf/native_probe_log.py
          python -c "import pathlib,tomllib; tomllib.loads(pathlib.Path('LostOdysseyRecompLib/config/LostOdysseyRecomp.toml').read_text())"
      - name: Initialize pinned generator and runtime headers
        shell: bash
        run: git submodule update --init --recursive --depth 1 tools/XenonRecomp thirdparty/o1heap thirdparty/unordered_dense
      - uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Stage existing authorized SDK input
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: python tools/release/fetch_build_input.py
      - name: Regenerate canonical hooks and bounded oracle
        shell: cmd
        run: |
          mkdir out\native-prepared-checks
          call tools\build_tools.bat > out\native-prepared-checks\codegen.log 2>&1 || (type out\native-prepared-checks\codegen.log & exit /b 1)
          python tools\ppc_codegen.py generate >> out\native-prepared-checks\codegen.log 2>&1 || (type out\native-prepared-checks\codegen.log & exit /b 1)
          python tools\tests\native_prepared_sdk_oracle.py --output out\native-prepared-checks\sdk_oracle.cpp || exit /b 1
      - name: Compile affected production units and compare SDK continuations
        shell: cmd
        run: |
          call tools\setup_windows.bat || exit /b 1
          set "LO_INCLUDES=/I LostOdysseyRecomp /I LostOdysseyRecompLib /I tools\XenonRecomp\XenonUtils /I tools\XenonRecomp\thirdparty\simde /I tools\XenonRecomp\thirdparty\fmt\include /I tools\XenonRecomp\thirdparty\xxHash /I thirdparty\unordered_dense\include /I thirdparty\o1heap\o1heap"
          set "LO_COMPILE=/nologo /std:c++20 /O2 /EHsc -march=sandybridge -fno-strict-aliasing /DLO_GPU_PLUME=1"
          clang-cl %LO_COMPILE% %LO_INCLUDES% /c LostOdysseyRecomp\gpu\command_processor.cpp /Fo:out\native-prepared-checks\command_processor.obj > out\native-prepared-checks\production.log 2>&1 || (type out\native-prepared-checks\production.log & exit /b 1)
          clang-cl %LO_COMPILE% %LO_INCLUDES% /c LostOdysseyRecomp\gpu\native_mesh_hooks.cpp /Fo:out\native-prepared-checks\hooks.obj >> out\native-prepared-checks\production.log 2>&1 || (type out\native-prepared-checks\production.log & exit /b 1)
          clang-cl %LO_COMPILE% %LO_INCLUDES% /c out\native-prepared-checks\sdk_oracle.cpp /Fo:out\native-prepared-checks\sdk.obj > out\native-prepared-checks\oracle-build.log 2>&1 || (type out\native-prepared-checks\oracle-build.log & exit /b 1)
          clang-cl %LO_COMPILE% %LO_INCLUDES% tools\tests\native_mesh_sdk_oracle.cpp out\native-prepared-checks\sdk.obj out\native-prepared-checks\hooks.obj /Fe:out\native-prepared-checks\entry.exe >> out\native-prepared-checks\oracle-build.log 2>&1 || (type out\native-prepared-checks\oracle-build.log & exit /b 1)
          clang-cl %LO_COMPILE% %LO_INCLUDES% tools\tests\native_prepared_sdk_oracle.cpp out\native-prepared-checks\sdk.obj out\native-prepared-checks\hooks.obj /Fe:out\native-prepared-checks\tail.exe >> out\native-prepared-checks\oracle-build.log 2>&1 || (type out\native-prepared-checks\oracle-build.log & exit /b 1)
          set LO_NATIVE_FRONTEND=mesh
          set LO_NATIVE_FRONTEND_PREPARED=0
          out\native-prepared-checks\entry.exe > out\native-prepared-checks\entry.log 2>&1 || (type out\native-prepared-checks\entry.log & exit /b 1)
          set LO_NATIVE_FRONTEND_PREPARED=1
          out\native-prepared-checks\tail.exe > out\native-prepared-checks\tail.log 2>&1 || (type out\native-prepared-checks\tail.log & exit /b 1)
          type out\native-prepared-checks\entry.log
          type out\native-prepared-checks\tail.log
          git rev-parse HEAD > out\native-prepared-checks\SOURCE.txt
          echo CPU_PREFIX_TAIL_AND_TWO_PRODUCTION_TUS_ONLY: preparation helpers are opaque models; no full app, game, GPU or performance acceptance > out\native-prepared-checks\SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-prepared-checks
          path: |
            out/native-prepared-checks/*.log
            out/native-prepared-checks/*.txt
          retention-days: 7
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit actual source and remove incomplete transport files
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply-prepared-tail.py
          git rm .github/native-tail-text-*.patch .github/native-tail-stage-0.b64 .github/apply-prepared-tail.py .github/workflows/native-prepared-delivery.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): hand off prepared SDK tails without replaying shader preparation'
          git push origin HEAD:refs/heads/fix/native-frontend-rework
          git rev-parse HEAD > SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-prepared-published-source
          path: SOURCE.txt
          retention-days: 7
