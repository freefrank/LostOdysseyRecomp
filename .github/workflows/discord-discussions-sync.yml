name: Discord to GitHub

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be copied without writing to GitHub
        default: true
        type: boolean

permissions:
  contents: read
  issues: write
  discussions: write
  actions: write  # start Issue triage for new issues

concurrency:
  group: discord-discussions-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy new Discord forum posts to GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1557289510436601899'
          # forum channel id -> "issues" or a Discussions category slug
          DISCORD_FORUMS: >-
            {"1557291045346213958": "issues",
             "1557428053179899924": "general",
             "1557428259627606047": "ideas",
             "1557428386199244863": "show-and-tell"}
          SYNC_LABEL: discord
          TRIAGE_WORKFLOW: issue-triage.yml
          TRIAGE_REF: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python tools/discord_sync/discord_sync.py
