name: Menu workbench
on:
  push:
    branches: [fix/menu-interaction]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive public source for offline menu regression
        run: git archive --format=tar --output="$RUNNER_TEMP/menu-source.tar" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: menu-source
          path: ${{ runner.temp }}/menu-source.tar
          retention-days: 1
