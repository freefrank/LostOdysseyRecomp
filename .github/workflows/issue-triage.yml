name: Issue triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to analyze
        required: true
        type: string
      dry_run:
        description: Preview without posting a comment
        default: true
        type: boolean
      comment_id:
        description: Optional existing @codex comment ID to analyze
        type: string
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@codex') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Analyze issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_COMMENT_ID: ${{ github.event.comment.id || inputs.comment_id }}
          ISSUE_TRIAGE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          # Subscription token created by the Claude GitHub App (also used by claude.yml).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_TRIAGE_MODEL: ${{ vars.ISSUE_TRIAGE_MODEL || 'claude-sonnet-5-5' }}
          ISSUE_TRIAGE_EFFORT: ${{ vars.ISSUE_TRIAGE_EFFORT || 'medium' }}
        run: |
          export SOURCE_REVISION="$(git rev-parse HEAD)"
          python tools/issue_triage/triage.py
      - name: Upload dry-run preview
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: issue-triage-preview
          path: issue-triage-preview.md
          if-no-files-found: ignore
          retention-days: 7
