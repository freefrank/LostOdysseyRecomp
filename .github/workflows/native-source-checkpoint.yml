name: Native renderer source checkpoint
on:
  push:
    branches: [feature/native-renderer-front-end]
    paths: [.github/workflows/native-source-checkpoint.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD -o native-source.tar.gz
          git rev-parse HEAD > SOURCE_REF.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-renderer-source
          path: |
            native-source.tar.gz
            SOURCE_REF.txt
          retention-days: 1
          compression-level: 0
