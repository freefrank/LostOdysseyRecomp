name: macOS arm64

# Builds and tests everything that does not need game data. The runtime itself
# links the recompiled game code, which is generated from a private default.xex;
# game data never enters CI, so the runtime link is not attempted here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      # Android, Linux packaging and Gitea CI never reach the macOS build.
      - 'packaging/android/**'
      - 'packaging/linux/**'
      - 'tools/android/**'
      - '.gitea/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      # Android, Linux packaging and Gitea CI never reach the macOS build.
      - 'packaging/android/**'
      - 'packaging/linux/**'
      - 'tools/android/**'
      - '.gitea/**'

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (no game data)
    # A PR merge commit was already built on its pull request; direct pushes to main still run.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request ')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          brew install ninja
          python -m pip install numpy pillow
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-sdl3.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-macos.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-macos.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Configure
        run: |
          cmake -S . -B out/build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DLO_BUILD_RECOMP_LIB=OFF \
            -DLO_BUILD_MOD_TESTS=ON
      - name: Build libraries and tests
        run: |
          # Skip targets with a missing input under LostOdysseyRecompLib (game data). `ninja -n` cannot
          # tell: the CMake glob check makes it stop after a simulated build.ninja regeneration.
          ( cd out/build/macos
            ninja -t targets all | grep -oE '^Lo[A-Za-z0-9]+(Test|Probe|Tool):' | tr -d ':' | sort -u |
            while read -r target; do
              missing=$(ninja -t inputs "$target" | grep '/LostOdysseyRecompLib/' |
                while read -r input; do [ -e "$input" ] || echo "$input"; done)
              if [ -z "$missing" ]; then
                echo "$target"
              else
                echo "::notice::$target needs game data ($(head -n 1 <<<"$missing")); skipped" >&2
              fi
            done > ci-candidates.txt )
          # Targets that include the generated PPC headers need game data too. Build past them and fail
          # only when some other compile, link or build step breaks.
          set +e
          ninja -C out/build/macos -k 0 plume spirv-cross-msl SDL3-static XenonUtils lo_portable_shader_pack lo_menu_lzo \
            lo_avcodec lo_avutil o1heap $(cat out/build/macos/ci-candidates.txt) 2>&1 | tee out/build/macos/ci-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            awk '/^FAILED: /{ if (failed && !ppc) bad = 1; failed = 1; seen = 1; ppc = 0; next }
                 /^\[[0-9]+\/[0-9]+\] /{ if (failed && !ppc) bad = 1; failed = 0; next }
                 /fatal error: .ppc\/[^ ]+. file not found/{ ppc = 1 }
                 END{ if (failed && !ppc) bad = 1; exit bad || !seen }' out/build/macos/ci-build.log
          fi
          while read -r target; do
            if [ -n "$(find out/build/macos -type f -perm -u+x -name "$target")" ]; then
              echo "$target"
            else
              echo "::notice::$target needs game data; skipped" >&2
            fi
          done < out/build/macos/ci-candidates.txt > out/build/macos/ci-targets.txt
      - name: Compile MetalFX FG game integration (no game data)
        run: |
          cmake -S tools/tests/motion_replay -B out/build/metalfx-fg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DLO_ENABLE_DLSS=OFF -DLO_ENABLE_FSR=OFF \
            -DLO_P2_VIDEO_COMPILE_CHECK=ON \
            -DLO_P2_VIDEO_SDL_HEADERS="$PWD/thirdparty/SDL/include" \
            -DLO_METALFX_FG_GAME_COMPILE_CHECK=ON
          cmake --build out/build/metalfx-fg --target fg_metal_compile p2_video_compile motion_renderer_compile
      - name: Run tests
        run: |
          scratch="$RUNNER_TEMP/lo-tests"
          mkdir -p "$scratch/home"
          export HOME="$scratch/home"
          failed=0
          while read -r test; do
            [ "$test" = LoShaderPackTool ] || [ "$test" = LoShaderTool ] || [ "$test" = LoImportPayloadProbe ] && continue
            binary=$(find out/build/macos -type f -perm -u+x -name "$test" | head -n 1)
            case "$test" in
              LoPipelineCacheTest|LoShaderPrebuildIoTest|LoShaderPreparationQueueTest|LoPortableShaderContractTest) args="$scratch/$test" ;;
              LoShaderResourceVariantsTest) mkdir -p "$scratch/$test"; args="$scratch/$test" ;;
              *) args="" ;;
            esac
            echo "::group::$test"
            if ! "$binary" $args; then echo "::error::$test failed"; failed=1; fi
            echo "::endgroup::"
          done < out/build/macos/ci-targets.txt
          exit $failed
      - name: Run Python tests
        run: |
          python -m unittest discover -s tools/tests -p 'test_*.py'
          python tools/tests/ppc_codegen_test.py
