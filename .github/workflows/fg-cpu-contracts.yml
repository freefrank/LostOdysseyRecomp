      - 'LostOdysseyRecomp/gpu/frame_plan.h'
      - 'LostOdysseyRecomp/gpu/upscaling_plan.*'

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the existing JSON header for Discord IPC contracts
        run: |
          git submodule update --init tools/XenonRecomp
          git -C tools/XenonRecomp submodule update --init thirdparty/tomlplusplus
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends cmake g++ python3
      - name: Configure reusable frame generation core
        run: cmake -S tools/tests/frame_generation -B build/fg-core
      - name: Build reusable frame generation core
        run: cmake --build build/fg-core --config Release --parallel 4
      - name: Test reusable frame generation core
        run: ctest --test-dir build/fg-core -C Release --output-on-failure
      - name: Configure GPU-free contracts
        run: cmake -S tools/tests/streamline_fg -B build/fg-contracts
      - name: Build
        run: cmake --build build/fg-contracts --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/fg-contracts -C Release --output-on-failure
      - name: Configure audio fixture
        run: cmake -S tools/tests/fast_forward_audio -B build/audio -DCMAKE_BUILD_TYPE=Release
      - name: Build audio fixture
        run: cmake --build build/audio --config Release --parallel 4
      - name: Test audio fixture and measure CPU
        run: ctest --test-dir build/audio -C Release --output-on-failure
      - name: Preserve contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fg-contracts-${{ matrix.os }}
          path: |
            build/fg-contracts/Testing/Temporary/LastTest.log
            build/audio/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
